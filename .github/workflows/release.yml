name: Release
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: '26.4.0'

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r --filter '!docs' --filter '!playground' --filter '!modern-cmdk-monorepo' --parallel run build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          # Publish via npm OIDC Trusted Publishing — no long-lived token.
          # An empty NPM_TOKEN / NODE_AUTH_TOKEN would make npm/pnpm try an empty
          # token and skip the OIDC fallback, so they are intentionally omitted.
          # id-token: write (permissions, above) supplies the short-lived OIDC token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
