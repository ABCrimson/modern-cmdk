  - '@pnpm/exe.linux-ppc64@12.20.0'
  - '@pnpm/exe.linux-riscv64@12.20.0'
  - '@pnpm/exe.linux-s390x@12.20.0'
  - '@pnpm/exe.linux-x64-musl@12.20.0'
  - '@pnpm/exe.linux-x64@12.20.0'
  - '@pnpm/exe.netbsd-x64@12.20.0'
  - '@pnpm/exe.win32-arm64@12.20.0'
  - '@pnpm/exe.win32-x64@12.20.0'
  # @playwright/test, playwright and playwright-core 1.66.0-alpha-2026-11-12 (dist-tag next-pending; @playwright/test published
  # 2026-11-12T05:21:58Z, playwright 05:19:51Z, playwright-core 06:41:55Z) were under the 24 h minimumReleaseAge at the 2026-11-12 bump from
  # 1.66.0-alpha-2026-11-11 (the lockfile re-resolves playwright and playwright-core to the same build). Drop after a day.
  - '@playwright/test@1.66.0-alpha-2026-11-12'
  - playwright@1.66.0-alpha-2026-11-12
  - playwright-core@1.66.0-alpha-2026-11-12
  # @testing-library/user-event@14.6.10 (latest; published 2026-11-12T04:41:23Z) was under the 24 h minimumReleaseAge at the 2026-11-12 bump. Drop after a day.
  - '@testing-library/user-event@14.6.10'
  # typescript@7.1.0-dev.20261111.1 (next; published 2026-11-11T08:45:28Z) and its seven @typescript/typescript-<platform> binaries
  # (08:36-08:47Z) were still under the 24 h minimumReleaseAge when the 2026-11-12 sweep installed (kept from the 2026-11-11 sweep). Drop after a day.
