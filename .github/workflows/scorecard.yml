name: Scorecard
# OpenSSF Scorecard with publish_results: true. The Scorecard API rejects a publishing workflow that has
# top-level env or defaults, workflow-level write permissions, or job steps outside its approved list
# (ossf/scorecard-action README, "Workflow Restrictions"); keep this file inside those limits.
on:
  branch_protection_rule:
  schedule:
    - cron: '23 3 * * 6'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@f3bbb05694c2f74569081c28664c0866d64dec21 # v4.39.3
        with:
          sarif_file: results.sarif
