name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: maintenance task; every task waits for CI on the dispatched commit
        type: choice
        required: true
        options: [backfill]

# A dispatched run gets its own group, so it can never replace a queued release run for a push.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Reset permissions; each job declares only what it needs.
permissions: {}

# Job graph. On a push to main: ci-gate -> select-mode -> (version -> first-publish-tarball -> first-publish-smoke -> first-publish-attest) | (pack -> attest -> publish).
# On a manual dispatch: ci-gate -> backfill. A job whose `needs` ancestor is skipped is
# skipped too, so a dispatch never reaches select-mode, version, first-publish-tarball, first-publish-smoke,
# first-publish-attest, pack, attest or publish and a push never reaches backfill.
#
# D62, a third published package (modern-cmdk-codemod): npm's trusted publishing is configured per existing
# package, so the owner first-publishes modern-cmdk-codemod 1.0.0 by hand. first-publish-tarball (version
# mode, after the Version PR is opened or updated) builds, packs, checks, hashes and uploads that tarball from the
# Version PR branch with source.txt, running no freshly resolved npm code; first-publish-smoke then downloads it,
# checks the digest and smoke-tests it; first-publish-attest, which needs both, verifies the downloaded bytes
# against the digest first-publish-tarball computed and attests them, for the owner to download and verify. The
# attest job then refuses a publish plan that holds a package npm has never seen, so merging the Version
# PR before the hand publish fails before anything is published; changeset publish skips an already-published version.
#
# ci-gate holds every other job until the ci.yml run for the same commit has completed and
# succeeded: nothing is published or released for a commit whose CI is red or cancelled. It also
# fails while any issue labelled `lane-red` is open: lanes.yml opens one when a scheduled lane (React
# canary, TypeScript latest or rc, xcode-27, weekly audit) is red, so a red lane blocks the next
# release. To override, fix the lane and close the issue; there is no other switch.
# `workflow_run` was rejected because its GITHUB_SHA and GITHUB_REF are the default branch
# head, not the commit that CI checked. ci.yml starts in parallel with this workflow, so
# the gate polls until that run appears and finishes.
#
# changesets/action v2.1.2 split into sub-actions, following the trusted-publishing
# setup in its README and https://changesets.dev/guide/automating: select-mode decides
# whether to version or publish; version opens/updates the release PR; pack builds the
# tarballs without any write permission; attest makes an SPDX SBOM, a build-provenance attestation
# and an SBOM attestation for each packed tarball; publish needs attest, so a failed attestation stops
# the release before npm has the version, and uploads those same tarballs. attest, first-publish-attest and
# publish are the only jobs holding id-token: write; attest and first-publish-attest take it for Sigstore with
# attestations: write and artifact-metadata: write and hold no npm credential, while publish holds
# contents: write and the npm OIDC publish. first-publish-smoke holds no id-token because it executes a
# freshly resolved npm tree (the smoke test installs the codemod without a lockfile and runs it), and it runs
# only after first-publish-tarball has hashed and uploaded the bytes; first-publish-tarball holds none because it
# only packs, hashes and uploads; first-publish-attest, which runs none of this repository's code, signs the bytes it verified.
# publish runs in the `npm` environment, whose deployment branches are restricted to main.
#
# Publish via npm OIDC Trusted Publishing — no long-lived token. An empty NPM_TOKEN /
# NODE_AUTH_TOKEN would make npm/pnpm try an empty token and skip the OIDC fallback, so
# they are intentionally omitted. The version and publish sub-actions push commits and
# tags through the GitHub API with their default `github-token` (github.token); a
# GITHUB_TOKEN env var is ignored. publish's `push-git-tags` and
# `create-github-releases` default to true, so per-package tags and GitHub releases are
# created after a publish. backfill is meant to create the missing tags and releases for
# the two npm versions that were published without them and for the hand-published
# modern-cmdk-codemod 1.0.0 (see the job for why it needs a token other than the GITHUB_TOKEN).
#
# Per the changesets guide, git credentials are not persisted on disk and no job here restores the
# pnpm cache (cache poisoning): setup-node keys it on the OS, architecture and lockfile hash alone,
# so any job that installs from the same lockfile could have written the entry a publishing job
# would restore. select-mode is included because it creates the publish plan that pack and publish consume.
jobs:
  ci-gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read # gh run list
      issues: read # gh issue list
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fail while a scheduled lane is red
        shell: bash
        run: |
          open=$(gh issue list --label lane-red --state open --json number --jq length)
          if [ "$open" -ne 0 ]; then
            echo "Open lane-red issues:"
            gh issue list --label lane-red --state open --json url --jq '.[].url'
            echo "::error::$open open lane-red issue(s) block the release. Fix the lane, then close the issue."
            exit 1
          fi
          echo "No open lane-red issue"
      - name: Wait for CI on this commit
        shell: bash
        run: |
          while true; do
            # Newest ci.yml push run for this commit as "<status> <conclusion|none> <url>"; empty until that run exists.
            if ! line=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --event push \
                --json databaseId,status,conclusion,url --limit 10 \
                --jq 'sort_by(.databaseId) | if length == 0 then empty else last | "\(.status) \(if .conclusion == null or .conclusion == "" then "none" else .conclusion end) \(.url)" end'); then
              echo "gh run list failed; retrying"
              sleep 30
              continue
            fi
            if [ -z "$line" ]; then
              echo "No ci.yml run for $GITHUB_SHA yet"
            else
              read -r status conclusion url <<< "$line"
              echo "CI run $url: status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "::error::CI did not succeed for $GITHUB_SHA ($conclusion): $url"
                exit 1
              fi
            fi
            sleep 30
          done

  select-mode:
    if: github.event_name == 'push'
    needs: ci-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # commit version changes (changesets/action/version)
      pull-requests: write # create/update the release PR (changesets/action/version)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update the release PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The action runs `script` without a shell, so the two commands live in the `version-packages` package.json script.
          # Every internal specifier is workspace:* and changeset version does not rewrite it (@changesets/apply-release-plan 8.1.1
          # dist/index.mjs:180 skips workspace:*), so pnpm-lock.yaml does not change; the script still refreshes the lockfile, and the
          # scope gate in first-publish-tarball fails if it ever does.
          script: pnpm version-packages
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"

  # D62: the owner first-publishes modern-cmdk-codemod 1.0.0 by hand (npm's trusted publishing is configured
  # per existing package), and this job builds the tarball for that publish from the Version PR branch, checks it,
  # hashes it and uploads it with source.txt; first-publish-smoke then smoke-tests the uploaded bytes and
  # first-publish-attest attests them (build provenance plus SBOM). Owner steps:
  # `gh run download <run id> -n first-publish-modern-cmdk-codemod`, `sha256sum -c`,
  # `gh attestation verify <tgz> -R ABCrimson/modern-cmdk`, then the owner-gated first publish of that tarball.
  # This job holds no npm credential, no id-token and restores no pnpm cache, so it can neither publish nor sign.
  # It runs no freshly resolved npm code (SEC-63): the digest is taken before any such code runs anywhere in the
  # run, and first-publish-smoke and first-publish-attest both check the downloaded bytes against it. It exposes
  # the tarball name and its sha256 for them.
  # This job runs inside the release run, before any approved CI on the bot PR can exist (the bot's
  # pushes wait in `action_required`), so the scope gate is what ties the packed tree to the CI-green
  # GITHUB_SHA plus the version edits: the branch must descend from GITHUB_SHA, may change only the "version"
  # line of package.json files, CHANGELOG.md files and changeset files, and must leave the lockfile unchanged.
  # Any other path, any other package.json line or any lockfile change fails the job.
  # Once the version is on npm (the publish plan then skips it), the job compares that package's contents
  # with a fresh pack of the branch instead and produces nothing to attest; a later version of a published package is skipped.
  # Temporary, like backfill: delete this job once the 1.5.0 post-cut gate has passed.
  first-publish-tarball:
    if: needs.select-mode.outputs.mode == 'version'
    needs: [select-mode, version]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout
    outputs:
      state: ${{ steps.registry.outputs.state }}
      tarball: ${{ steps.hash.outputs.tarball }}
      sha256: ${{ steps.hash.outputs.sha256 }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      # changesets/action/version pushes changeset-release/<base branch> (live ref: changeset-release/main) and
      # opens the Version PR from it; its README documents pr-base-branch, which defaults to github.ref_name (main).
      - name: Check out the Version PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: changeset-release/main
          fetch-depth: 0
          persist-credentials: false
      - name: Scope gate, the branch is GITHUB_SHA plus version edits only
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base=$(git merge-base origin/main HEAD)
          if [ "$base" != "$GITHUB_SHA" ]; then
            echo "::error::The Version PR branch descends from $base, not from the CI-checked $GITHUB_SHA"
            exit 1
          fi
          re='^(packages/[^/]+/(package\.json|CHANGELOG\.md)|\.changeset/[^/]+\.md|pnpm-lock\.yaml)$'
          outside=$(git diff --name-only "$base" HEAD | re="$re" awk '$0 !~ ENVIRON["re"]')
          if [ -n "$outside" ]; then
            echo "::error::The Version PR branch changes paths outside the version edits:"
            echo "$outside"
            exit 1
          fi
          bad=$(git diff -U0 "$base" HEAD -- 'packages/*/package.json' | awk '/^(\+\+\+|---) /{next} /^[-+]/ && $0 !~ /^[-+]  "version": "[^"]+",$/')
          if [ -n "$bad" ]; then
            echo "::error::The Version PR branch edits a package.json beyond its \"version\" field:"
            echo "$bad"
            exit 1
          fi
          if ! git diff --quiet "$base" HEAD -- pnpm-lock.yaml; then
            echo "::error::The Version PR branch changes pnpm-lock.yaml; every internal specifier is workspace:*, which changeset version does not rewrite"
            git diff --stat "$base" HEAD -- pnpm-lock.yaml
            exit 1
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Scope gate passed: $(git diff --name-only "$base" HEAD | wc -l) changed path(s), all version edits"
      - name: Read the version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er .version packages/modern-cmdk-codemod/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # E404 on the package-level `npm view modern-cmdk-codemod version` means the package was never published
      # (first). Otherwise a version npm has is published, and any other version is later: a version of an
      # existing package is published by trusted publishing, not by hand, so this job neither attests nor uploads it.
      - name: Ask npm whether this version is published
        id: registry
        shell: bash
        env:
          version: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          err=$(mktemp)
          if ! npm view modern-cmdk-codemod version > /dev/null 2> "$err"; then
            if grep -q 'E404' "$err"; then echo "state=first" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::error::npm view modern-cmdk-codemod failed: $(cat "$err")"; exit 1
          fi
          if out=$(npm view "modern-cmdk-codemod@$version" version 2> "$err") && [ "$out" = "$version" ]; then
            echo "state=published" >> "$GITHUB_OUTPUT"
          elif [ -z "${out:-}" ] || grep -q 'E404' "$err"; then
            echo "state=later" >> "$GITHUB_OUTPUT"
            echo "::notice::$version of an existing package is published by trusted publishing, not by hand"
          else
            echo "::error::npm view modern-cmdk-codemod@$version: ${out:-} $(cat "$err")"; exit 1
          fi
      - if: steps.registry.outputs.state != 'later'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.registry.outputs.state != 'later'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - if: steps.registry.outputs.state != 'later'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.registry.outputs.state != 'later'
        run: pnpm --filter modern-cmdk-codemod run build
      - name: Pack and check the tarball
        if: steps.registry.outputs.state != 'later'
        id: pack
        shell: bash
        env:
          version: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          mkdir first-publish
          pnpm --filter modern-cmdk-codemod pack --pack-destination "$GITHUB_WORKSPACE/first-publish"
          tgz="first-publish/modern-cmdk-codemod-$version.tgz"
          [ -f "$tgz" ] || { echo "::error::$tgz was not produced"; ls first-publish; exit 1; }
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          node scripts/check-package.ts --package modern-cmdk-codemod --tarball "$tgz"
      # A pack is not byte-reproducible (gzip headers may differ), so the comparison is entry by entry:
      # the same names with the same contents, or the job fails.
      - name: Compare with the published version
        if: steps.registry.outputs.state == 'published'
        shell: bash
        env:
          version: ${{ steps.package.outputs.version }}
          LOCAL_TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          mkdir registry-tarball
          npm pack "modern-cmdk-codemod@$version" --pack-destination registry-tarball
          REMOTE_TGZ="registry-tarball/modern-cmdk-codemod-$version.tgz"
          export REMOTE_TGZ
          for file in "$LOCAL_TGZ" "$REMOTE_TGZ"; do
            echo "sha512 $file: sha512-$(openssl dgst -sha512 -binary "$file" | base64 -w0)"
          done
          echo "npm view dist.integrity: $(npm view "modern-cmdk-codemod@$version" dist.integrity)"
          node --input-type=module - <<'EOF'
          import { readFileSync } from 'node:fs';
          import { listTarEntries } from './scripts/check-package.ts';
          const read = (path) => new Map(listTarEntries(readFileSync(path)).map((e) => [e.name, e.data]));
          const local = read(process.env.LOCAL_TGZ);
          const remote = read(process.env.REMOTE_TGZ);
          const problems = [];
          for (const name of local.keys()) if (!remote.has(name)) problems.push(`only in the new pack: ${name}`);
          for (const name of remote.keys()) if (!local.has(name)) problems.push(`only on npm: ${name}`);
          for (const [name, data] of local) {
            const other = remote.get(name);
            if (other !== undefined && !data.equals(other)) problems.push(`contents differ: ${name}`);
          }
          if (problems.length > 0) {
            console.error(`::error::The branch's pack differs from the published version:\n${problems.join('\n')}`);
            process.exit(1);
          }
          console.log(`${local.size} entries, identical names and bytes`);
          EOF
          echo "::notice::modern-cmdk-codemod@$version is already on npm and the branch packs to the same contents; nothing to hand-publish"
      - name: Hash the tarball
        if: steps.registry.outputs.state == 'first'
        id: hash
        shell: bash
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          echo "tarball=$(basename "$TGZ")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum -- "$TGZ" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Record the source
        if: steps.registry.outputs.state == 'first'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "ci-checked commit (GITHUB_SHA): $GITHUB_SHA"
            echo "Version PR head: $(git rev-parse HEAD)"
            echo "packages/modern-cmdk-codemod tree: $(git rev-parse HEAD:packages/modern-cmdk-codemod)"
          } > first-publish/source.txt
          cat first-publish/source.txt
          (cd first-publish && sha256sum -- *.tgz > modern-cmdk-codemod.sha256)
      - name: Upload the first-publish artifact
        if: steps.registry.outputs.state == 'first'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-publish-modern-cmdk-codemod
          path: |
            first-publish/*.tgz
            first-publish/*.sha256
            first-publish/source.txt
          retention-days: 30
          if-no-files-found: error

  # SEC-63: smoke-tests the tarball first-publish-tarball hashed and uploaded. The smoke executes the tarball's freshly
  # resolved npm tree (no lockfile), which could rewrite a file it can reach, so it runs after the bytes are fixed and
  # uploaded, in a job that holds no credential, uploads nothing and re-checks the downloaded bytes against the digest
  # first. Its failure blocks first-publish-attest through needs.
  # Temporary, like first-publish-tarball: delete this job with it.
  first-publish-smoke:
    if: needs.first-publish-tarball.outputs.state == 'first'
    needs: first-publish-tarball
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout
    steps:
      # The commit first-publish-tarball scope-gated, not the moving Version PR ref: a push to the ref between the two jobs
      # must not change the smoke script or its fixtures.
      - name: Check out the scope-gated Version PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.first-publish-tarball.outputs.head }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # scripts/codemod-tarball-smoke.ts imports listTarEntries from scripts/check-package.ts, whose top-level imports include publint.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the first-publish artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: first-publish-modern-cmdk-codemod
          path: first-publish
      - name: Verify the tarball is the one the tarball job hashed
        shell: bash
        env:
          TARBALL: ${{ needs.first-publish-tarball.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.first-publish-tarball.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$TARBALL" ] || [ -z "$EXPECTED_SHA256" ] || [ "$(basename "$TARBALL")" != "$TARBALL" ]; then
            echo "::error::The tarball job did not name a tarball and its sha256"
            exit 1
          fi
          if [ ! -f "first-publish/$TARBALL" ]; then
            echo "::error::Expected first-publish/$TARBALL:"
            ls first-publish
            exit 1
          fi
          actual=$(sha256sum -- "first-publish/$TARBALL" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::first-publish/$TARBALL has sha256 $actual, not the $EXPECTED_SHA256 the tarball job hashed"
            exit 1
          fi
          echo "first-publish/$TARBALL matches the hashed sha256 $actual"
      - name: Smoke-test the tarball
        shell: bash
        env:
          TARBALL: ${{ needs.first-publish-tarball.outputs.tarball }}
        run: node scripts/codemod-tarball-smoke.ts --codemod "first-publish/$TARBALL"

  # D62: signs what first-publish-tarball built and hashed and first-publish-smoke tested, and nothing else. It checks out nothing
  # (actions/attest and anchore/sbom-action read only the files named in their inputs), installs nothing and runs none of this
  # repository's code, so the Sigstore credential never meets a freshly resolved npm tree. It refuses any tarball whose sha256
  # differs from the digest first-publish-tarball recorded, taken before any freshly resolved npm code ran, and it needs
  # first-publish-smoke, so a failed smoke blocks the attestation.
  # Temporary, like first-publish-tarball: delete this job with it.
  first-publish-attest:
    if: needs.first-publish-tarball.outputs.state == 'first'
    needs: [first-publish-tarball, first-publish-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate (actions/attest)
      attestations: write # persist the attestations (actions/attest)
      artifact-metadata: write # artifact storage record (actions/attest)
    steps:
      - name: Download the first-publish artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: first-publish-modern-cmdk-codemod
          path: first-publish
      - name: Verify the tarball is the one the tarball job hashed
        shell: bash
        env:
          TARBALL: ${{ needs.first-publish-tarball.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.first-publish-tarball.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$TARBALL" ] || [ -z "$EXPECTED_SHA256" ] || [ "$(basename "$TARBALL")" != "$TARBALL" ]; then
            echo "::error::The tarball job did not name a tarball and its sha256"
            exit 1
          fi
          count=$(find first-publish -maxdepth 1 -name '*.tgz' | wc -l)
          if [ "$count" -ne 1 ] || [ ! -f "first-publish/$TARBALL" ]; then
            echo "::error::Expected exactly first-publish/$TARBALL, found $count tarball(s):"
            ls first-publish
            exit 1
          fi
          actual=$(sha256sum -- "first-publish/$TARBALL" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::first-publish/$TARBALL has sha256 $actual, not the $EXPECTED_SHA256 the tarball job hashed"
            exit 1
          fi
          echo "first-publish/$TARBALL matches the hashed sha256 $actual"
      # Same SBOM recipe as the attest job: syft reads package.json only for installed sources and a tarball
      # holds no lockfile, so syft.yaml adds the javascript-package-cataloger; the tarball is unpacked on this
      # Linux runner.
      - name: Unpack the tarball for the SBOM scan
        shell: bash
        env:
          TGZ: first-publish/${{ needs.first-publish-tarball.outputs.tarball }}
        run: |
          set -euo pipefail
          mkdir sbom-src
          tar -xzf "$TGZ" -C sbom-src
          printf 'select-catalogers:\n  - "+javascript-package-cataloger"\n' > syft.yaml
      - name: SBOM for modern-cmdk-codemod
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src
          format: spdx-json
          config: syft.yaml
          output-file: first-publish/modern-cmdk-codemod.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          # syft itself, newest release (sbom-action v0.24.3 defaults to v1.54.0). Re-resolve with: gh release list -R anchore/syft -L 1
          syft-version: v1.56.0
      - name: Build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: first-publish/*.tgz
      - name: SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: first-publish/*.tgz
          sbom-path: first-publish/modern-cmdk-codemod.spdx.json
      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-publish-modern-cmdk-codemod-sbom
          path: first-publish/modern-cmdk-codemod.spdx.json
          retention-days: 30
          if-no-files-found: error

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter './packages/*' run build
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Supply chain: every tarball that pack produced (up to three: modern-cmdk, create-modern-cmdk and
  # modern-cmdk-codemod) gets an SPDX SBOM, a build-provenance attestation and an SBOM attestation, over
  # the exact bytes publish uploads (same artifact id, never re-packed). It also refuses a package npm
  # has never published (D62: its first publish is the owner's, from the first-publish-tarball artifact).
  # publish needs this job, so an attestation failure or that refusal stops the release before npm has the version.
  # Permissions follow the actions/attest README ("Ensure that the following permissions are set"):
  # id-token (Sigstore signing certificate), attestations (persist the attestation) and artifact-metadata
  # (artifact storage record). No contents, no checkout, no pnpm cache and no npm credential here.
  attest:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, pack]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore signing certificate (actions/attest)
      attestations: write # persist the attestations (actions/attest)
      artifact-metadata: write # artifact storage record (actions/attest)
    steps:
      - name: Download the packed tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: pack
      # Fails loudly unless the tarball set is exactly the publish plan, every tarball is one of the three
      # published packages, npm already knows each package (D62: `npm view` E404 means never published, which
      # is the owner's hand publish; any other npm error fails too) and its sha256 equals the plan's
      # integrity (the bytes publish will upload).
      # Each tarball is also unpacked under sbom-src/<package> for the SBOM scan. Syft's directory defaults leave out
      # javascript-package-cataloger (it reads package.json only for installed/image sources) and a tarball holds no
      # lockfile, so syft.yaml adds that cataloger; without it the SBOM lists no package.
      - name: Check the pack layout and unpack for the SBOM scan
        id: tarballs
        shell: bash
        run: |
          set -euo pipefail
          plan=pack/publish-plan.json
          [ -f "$plan" ] || { echo "::error::$plan is missing from the pack artifact"; exit 1; }
          mapfile -t releases < <(jq -r '.plan[][] | select(.kind == "publish") | [.name, .tarball.path, .tarball.integrity] | @tsv' "$plan")
          echo "count=${#releases[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#releases[@]}" -eq 0 ]; then
            echo "::notice::The publish plan holds no package to publish; nothing to attest"
            exit 0
          fi
          mapfile -t on_disk < <(cd pack && printf '%s\n' packages/*.tgz | sort)
          mapfile -t planned < <(printf '%s\n' "${releases[@]}" | cut -f2 | sort)
          if [ "${on_disk[*]}" != "${planned[*]}" ]; then
            echo "::error::Tarballs on disk (${on_disk[*]}) differ from the publish plan (${planned[*]})"
            exit 1
          fi
          mkdir sbom sbom-src
          printf 'select-catalogers:\n  - "+javascript-package-cataloger"\n' > syft.yaml
          for release in "${releases[@]}"; do
            IFS=$'\t' read -r name tarball integrity <<< "$release"
            case "$name" in
              modern-cmdk) key=modern_cmdk ;;
              create-modern-cmdk) key=create_modern_cmdk ;;
              modern-cmdk-codemod) key=modern_cmdk_codemod ;;
              *) echo "::error::No attestation steps for published package $name; add them to the attest job"; exit 1 ;;
            esac
            if ! registry=$(npm view "$name" version 2>&1); then
              if grep -q 'E404' <<< "$registry"; then
                echo "::error::first publish of $name is owner-gated (D62); publish it by hand first"
              else
                echo "::error::npm view $name failed: $registry"
              fi
              exit 1
            fi
            actual="sha256-$(openssl dgst -sha256 -binary "pack/$tarball" | base64)"
            if [ "$actual" != "$integrity" ]; then
              echo "::error::$tarball digest $actual differs from the plan's $integrity"
              exit 1
            fi
            mkdir "sbom-src/$key"
            tar -xzf "pack/$tarball" -C "sbom-src/$key"
            echo "$key=pack/$tarball" >> "$GITHUB_OUTPUT"
          done
      - name: SBOM for modern-cmdk
        if: steps.tarballs.outputs.modern_cmdk != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src/modern_cmdk
          format: spdx-json
          config: syft.yaml
          output-file: sbom/modern-cmdk.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          # syft itself, newest release (sbom-action v0.24.3 defaults to v1.54.0). Re-resolve with: gh release list -R anchore/syft -L 1
          syft-version: v1.56.0
      - name: SBOM for create-modern-cmdk
        if: steps.tarballs.outputs.create_modern_cmdk != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src/create_modern_cmdk
          format: spdx-json
          config: syft.yaml
          output-file: sbom/create-modern-cmdk.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          # syft itself, newest release (sbom-action v0.24.3 defaults to v1.54.0). Re-resolve with: gh release list -R anchore/syft -L 1
          syft-version: v1.56.0
      - name: SBOM for modern-cmdk-codemod
        if: steps.tarballs.outputs.modern_cmdk_codemod != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src/modern_cmdk_codemod
          format: spdx-json
          config: syft.yaml
          output-file: sbom/modern-cmdk-codemod.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          # syft itself, newest release (sbom-action v0.24.3 defaults to v1.54.0). Re-resolve with: gh release list -R anchore/syft -L 1
          syft-version: v1.56.0
      - name: Build provenance attestation
        if: steps.tarballs.outputs.count != '0'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: pack/packages/*.tgz
      # sbom-path takes one SBOM, so each tarball has its own SBOM attestation step.
      - name: SBOM attestation for modern-cmdk
        if: steps.tarballs.outputs.modern_cmdk != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.tarballs.outputs.modern_cmdk }}
          sbom-path: sbom/modern-cmdk.spdx.json
      - name: SBOM attestation for create-modern-cmdk
        if: steps.tarballs.outputs.create_modern_cmdk != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.tarballs.outputs.create_modern_cmdk }}
          sbom-path: sbom/create-modern-cmdk.spdx.json
      - name: SBOM attestation for modern-cmdk-codemod
        if: steps.tarballs.outputs.modern_cmdk_codemod != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.tarballs.outputs.modern_cmdk_codemod }}
          sbom-path: sbom/modern-cmdk-codemod.spdx.json
      - name: Upload the SBOMs
        if: steps.tarballs.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom/*.spdx.json
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: [pack, attest]
    environment: npm
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # push tags and create GitHub releases (changesets/action/publish)
      id-token: write # npm trusted publishing (changesets/action/publish)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # No `script`: with a pack-dir artifact the sub-action runs `changeset publish
      # --from-pack-dir <dir>` itself (a custom script would bypass the packed tarballs).
      - name: Publish packages
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

  # Temporary: modern-cmdk@1.2.2 and create-modern-cmdk@1.2.1 reached npm (commit 33678255)
  # without a git tag or GitHub release, and modern-cmdk-codemod@1.0.0 reaches npm by the owner's hand
  # (D62) before the Version PR merges. changeset publish drops a version npm already has from its
  # publish plan (@changesets/cli 3.0.3 getPublishPlan: `if (!publishedVersions.includes(localVersion))`
  # builds the "publish" release), so for the hand-published version it creates neither the tag nor the
  # GitHub release; this job does. The Version PR lands as one commit on main (the repository allows only
  # rebase and squash merges), and that commit is the oldest to set `"version": "1.0.0"` in
  # packages/modern-cmdk-codemod/package.json, which is how `version-commit` below finds the target.
  # `gh release create` creates each tag through the API at
  # --target, so no tag is pushed by hand. That API call needs a token authorized to modify
  # workflows when the target commit's .github/workflows differs from the default branch's
  # (docs.github.com, "Create a release"); the GITHUB_TOKEN cannot be, and the workflows changed
  # after 33678255, so with the GITHUB_TOKEN below the two historical entries fail with HTTP 403
  # (run 41786088539) until D34 is wired. A failed entry is recorded and the loop goes on, so those two
  # cannot stop the codemod entry; the job exits 1 at the end, listing every failed tag.
  # It works only after GH_TOKEN is pointed at a token holding the Workflows permission.
  # Delete this job (and the `backfill` dispatch option) once the 1.5.0 post-cut gate
  # "gh release list equals npm" has passed.
  backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'backfill'
    needs: ci-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # create tags and GitHub releases (gh release create)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create the missing tags and releases
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::backfill resolves version-commit on main; dispatch it on main (this run is on $GITHUB_REF)"
            exit 1
          fi
          # tag | package directory | CHANGELOG heading of that version | target commit, or `version-commit`
          entries=(
            "modern-cmdk-codemod@1.0.0|modern-cmdk-codemod|## 1.0.0|version-commit"
            "modern-cmdk@1.2.2|modern-cmdk|## 1.2.2|33678255dcee29a02a1222c10f5698f47cf7f24c"
            "create-modern-cmdk@1.2.1|create-modern-cmdk|## 1.2.1|33678255dcee29a02a1222c10f5698f47cf7f24c"
          )
          # Runs inside `if !`, where `set -e` is off: every step that can fail returns 1 itself.
          backfill_one() {
            local tag=$1 dir=$2 heading=$3 sha=$4 notes version
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::Release $tag already exists; skipping"
              return 0
            fi
            if [ "$sha" = version-commit ]; then
              version=${heading#\#\# }
              # The oldest commit on the checked-out main that set this version; sed -n 1p reads all of git log's output (head -n1 would SIGPIPE it).
              sha=$(git log --reverse --format=%H -G "\"version\": \"${version//./\\.}\"" -- "packages/$dir/package.json" | sed -n 1p) || return 1
              if [ -z "$sha" ]; then
                echo "::error::No commit on this checkout set \"version\": \"$version\" in packages/$dir/package.json"
                return 1
              fi
            fi
            notes=$(mktemp)
            # The CHANGELOG section under $heading, without the heading line and without surrounding blank lines.
            awk -v heading="$heading" '
              $0 == heading { on = 1; next }
              on && /^## / { exit }
              on && NF == 0 { blank++; next }
              on { if (started) while (blank-- > 0) print ""; blank = 0; started = 1; print }
            ' "packages/$dir/CHANGELOG.md" > "$notes" || return 1
            if [ ! -s "$notes" ]; then
              echo "::error::No '$heading' section in packages/$dir/CHANGELOG.md"
              return 1
            fi
            gh release create "$tag" --target "$sha" --title "$tag" --notes-file "$notes" --latest=false --verify-tag=false || return 1
          }
          failed=()
          for entry in "${entries[@]}"; do
            IFS='|' read -r tag dir heading sha <<< "$entry"
            if ! backfill_one "$tag" "$dir" "$heading" "$sha"; then
              echo "::error::Backfilling $tag failed"
              failed+=("$tag")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::Backfill failed for: ${failed[*]}"
            exit 1
          fi
