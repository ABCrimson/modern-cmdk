packages:
  - 'packages/*'
  - 'apps/*'
# Single source of the exact pins that two or more workspace manifests share: the six RDG-66 pins (react, react-dom,
# @types/react, @types/react-dom, typescript, vite; D54) and the five RDG-117 pins (@types/node, tsdown, jscodeshift,
# @types/jscodeshift, radix-ui; 1.5.0). Workspace manifests reference them as catalog:; the freshness sweep checks these
# entries at this site (dep-freshness-catalog.mjs, 2026-11-04). apps/docs keeps its own typescript pin (a scoped hold for
# vue-tsc) and the tests/consumers apps are not workspace projects. Peer ranges (modern-cmdk's radix-ui >=1.4.0 <2.0.0)
# and idb-keyval, a runtime dependency written out in its manifests, stay outside the catalog.
catalog:
  '@types/jscodeshift': 17.3.0
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  jscodeshift: 17.4.0
  radix-ui: 1.8.2-rc.1791984254107
  react: 0.0.0-experimental-1620f7b9-20261111
  react-dom: 0.0.0-experimental-1620f7b9-20261111
  tsdown: 0.23.7
  typescript: 7.1.0-dev.20261111.1
  vite: 8.3.8
overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
  # SEC-71 (Dependabot alert #41, GHSA-g3hv-75wg-m249, fixed in minimatch 11.0.1): @vscode/vsce 4.1.1-0, a devDependency of
  # packages/vscode-modern-cmdk (nothing published depends on it), declares minimatch ^10.2.6, which resolved to the vulnerable 10.2.6
  # (every @vscode/vsce build declares ^10.2.6). Pinned to the newest minimatch (11.0.5, published 2026-11-05T23:30Z, BlueOak-1.0.0). Drop this
  # override when a @vscode/vsce build declares minimatch 11.
  minimatch: 11.0.5
allowBuilds:
  esbuild: true
  lefthook: true
  # 2026-11-04: @vscode/vsce-sign (postinstall fetches a signing binary) arrives with @vscode/vsce; signing is publish-only and
  # `vsce package --no-dependencies` does not use it, so its build stays off (W2-03; .vsix listing proves packaging works).
  '@vscode/vsce-sign': false
# Agent skills (pnpm 12.20.0 `pnpm approve`): tsdown ships a skills/ directory and pnpm links an approved skill into
# .claude/skills/<name> on install (skills.dirs below), writing the managed .gitignore block there (committed). Approved by the owner on 2026-11-07 (G-43);
# nothing else awaits approval (`pnpm install` lists any new package).
permissions:
  tsdown:
    skills: true
# skills.dirs (pnpm 12.11.0+) names the directory the approved skills are linked into; unset, pnpm picks the directories that
# exist in the workspace root plus the one of the agent running it, so the link target would depend on who runs the install.
skills:
  dirs:
    - .claude/skills
# Supply-chain policy (pnpm 12.20.0). minimumReleaseAge is in minutes (1440 = 1 day, the built-in
# default, written out so the policy is visible). minimumReleaseAgeStrict: true fails resolution when
# no version in the requested range meets minimumReleaseAge instead of falling back to a younger one
# (pnpm.io/settings: it defaults to true only when minimumReleaseAge is set explicitly; written out
# here too). trustPolicy: no-downgrade fails the install for a version whose publish-trust evidence
# (provenance, trusted publisher) is weaker than an earlier release's.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# Exact versions published (per the npm registry, checked 2026-10-30) without provenance or a
# trusted publisher after an earlier release of the same package had one:
#   lefthook@2.2.2 - manual publish by a maintainer on 2026-10-13; 2.2.1 and 2.2.0 came from GitHub Actions
#   semver@5.7.2, semver@6.3.1 - 2023-07-10 backport patches; 7.5.4 (2023-07-07) had provenance.
#   pnpm-lock.yaml resolves semver@5.7.2 via jscodeshift > @babel/register > make-dir@2.1.0.
trustPolicyExclude:
  - lefthook@2.2.2
  - semver@5.7.2
  - semver@6.3.1
# Exact versions published less than minimumReleaseAge before the 2026-11-12 sweep install (pruned 2026-11-12 06:45 UTC: the pnpm 12.19.0,
# canary.47, playwright 2026-11-11, react b05c0b75, vite 8.3.8, user-event 14.6.9 and web-features 20261110231328 entries, all past 24 h or replaced);
# pnpm 12.20.0 refuses them otherwise. Entries age out of need after a day.
minimumReleaseAgeExclude:
  # @biomejs/biome@2.6.7 (latest; published 2026-11-11T21:44:33Z) and its ten @biomejs/cli-<platform> binaries (21:45-21:50Z) were
  # under the 24 h minimumReleaseAge at the 2026-11-12 bump from 2.6.6. Drop after a day.
  - '@biomejs/biome@2.6.7'
  - '@biomejs/cli-android-arm64@2.6.7'
  - '@biomejs/cli-android-x64@2.6.7'
  - '@biomejs/cli-darwin-arm64@2.6.7'
  - '@biomejs/cli-darwin-x64@2.6.7'
  - '@biomejs/cli-linux-arm64-musl@2.6.7'
  - '@biomejs/cli-linux-arm64@2.6.7'
  - '@biomejs/cli-linux-x64-musl@2.6.7'
  - '@biomejs/cli-linux-x64@2.6.7'
  - '@biomejs/cli-win32-arm64@2.6.7'
  - '@biomejs/cli-win32-x64@2.6.7'
  # next@16.5.0-canary.48 (the root devDependency for the docs-samples gate, TEB-84 and D57, and the tests/consumers/next-app pin) was
  # published 2026-11-11T23:56:33Z (its platform binaries 23:44-23:49Z), under the 24 h minimumReleaseAge at the
  # 2026-11-12 bump from canary.47; with its @next/env and platform binaries. Drop after a day.
  - next@16.5.0-canary.48
  - '@next/env@16.5.0-canary.48'
  - '@next/swc-darwin-arm64@16.5.0-canary.48'
  - '@next/swc-darwin-x64@16.5.0-canary.48'
  - '@next/swc-linux-arm64-gnu@16.5.0-canary.48'
  - '@next/swc-linux-arm64-musl@16.5.0-canary.48'
  - '@next/swc-linux-x64-gnu@16.5.0-canary.48'
  - '@next/swc-linux-x64-musl@16.5.0-canary.48'
  - '@next/swc-win32-arm64-msvc@16.5.0-canary.48'
  - '@next/swc-win32-x64-msvc@16.5.0-canary.48'
  # pnpm@12.20.0 (next-12, published 2026-11-12T00:23:01Z) and its fifteen @pnpm/exe platform packages (00:21:58-00:23:05Z),
  # under the 24 h minimumReleaseAge when packageManager moved to it on 2026-11-12. Drop after a day.
  - pnpm@12.20.0
  - '@pnpm/exe.android-arm64@12.20.0'
  - '@pnpm/exe.android-x64@12.20.0'
  - '@pnpm/exe.darwin-arm64@12.20.0'
  - '@pnpm/exe.darwin-x64@12.20.0'
