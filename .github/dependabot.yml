version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # A dependency that matches more than one group joins the first one listed, so the three
    # specific groups come before the two catch-all groups.
    groups:
      typescript:
        patterns: ['typescript']
        update-types: [minor, patch]
      biome:
        patterns: ['@biomejs/*']
        update-types: [minor, patch]
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # react and react-dom are pinned to a 0.0.0-experimental-* build in the pnpm-workspace.yaml catalog (the
      # overrides reference it as catalog:), and scheduler follows react-dom's exact dependency on the same
      # build. A scheduled re-resolution outside Dependabot keeps them current. Dependabot cannot order
      # 0.0.0-experimental-* builds: PR #48 (2026-11-02) proposed 0.14.10, a 2020 release that it sorts above
      # them. Ignored for every update type.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'scheduler'
      # @playwright/test is pinned to a 1.x.0-alpha-<date> prerelease build, and a scheduled re-resolution
      # outside Dependabot keeps it current. Dependabot cannot order Playwright's alpha builds: they carry
      # either a date (1.66.0-alpha-2026-11-08) or a millisecond timestamp (1.66.0-alpha-1793916328000), and
      # it proposed the older timestamp build over the newer date build in PRs #14, #50 and #67. The
      # `versions` key of an npm ignore takes semver ranges, not globs like `*-alpha-*`, so no range can
      # single out the alpha builds and the rule ignores the whole package family. Remove it when the
      # catalog pins a stable Playwright release.
      - dependency-name: '@playwright/*'
      - dependency-name: 'playwright'
      - dependency-name: 'playwright-core'
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
    commit-message:
      prefix: "ci(deps):"

  - package-ecosystem: cargo
    directory: /packages/command-search-wasm/crate
    schedule:
      interval: monthly
    labels:
      - dependencies
      - wasm
    commit-message:
      prefix: "chore(deps):"
