# Lefthook 2.2.2 — parallel execution, skip conditions, zero npm deps
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --staged --no-errors-on-unmatched {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm --filter 'modern-cmdk' exec tsc --noEmit
      skip:
        - merge
        - rebase

pre-push:
  parallel: true
  jobs:
    - name: test
      run: pnpm exec vitest run --reporter=dot
    - name: size
      # Only check size if packages changed — skip full rebuild on docs-only pushes
      glob: "packages/*/src/**/*.{ts,tsx}"
      run: pnpm --filter './packages/*' run build && pnpm exec size-limit
