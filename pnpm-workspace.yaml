  # react, react-dom and scheduler 0.0.0-experimental-1620f7b9-20261111 (dist-tag experimental; published 2026-11-11T16:21:39Z, 16:22:01Z and
  # 16:21:54Z) were under the 24 h minimumReleaseAge at the 2026-11-12 bump. Drop after a day.
  - react@0.0.0-experimental-1620f7b9-20261111
