packages:
  - 'packages/*'
  - 'apps/*'
overrides:
  react: 0.0.0-experimental-e84e1492-20261031
  react-dom: 0.0.0-experimental-e84e1492-20261031
allowBuilds:
  esbuild: true
  lefthook: true
# Supply-chain policy (pnpm 12.17.0). minimumReleaseAge is in minutes (1440 = 1 day, the built-in
# default, written out so the policy is visible). minimumReleaseAgeStrict: true fails resolution when
# no version in the requested range meets minimumReleaseAge instead of falling back to a younger one
# (pnpm.io/settings: it defaults to true only when minimumReleaseAge is set explicitly; written out
# here too). trustPolicy: no-downgrade fails the install for a version whose publish-trust evidence
# (provenance, trusted publisher) is weaker than an earlier release's.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# Exact versions published (per the npm registry, checked 2026-10-30) without provenance or a
# trusted publisher after an earlier release of the same package had one:
#   lefthook@2.2.2 - manual publish by a maintainer on 2026-10-13; 2.2.1 and 2.2.0 came from GitHub Actions
#   semver@5.7.2, semver@6.3.1 - 2023-07-10 backport patches; 7.5.4 (2023-07-07) had provenance.
#   pnpm-lock.yaml resolves semver@5.7.2 via jscodeshift > @babel/register > make-dir@2.1.0.
trustPolicyExclude:
  - lefthook@2.2.2
  - semver@5.7.2
  - semver@6.3.1
# Exact versions published less than minimumReleaseAge before the 2026-10-31 lockfile refresh (pruned 2026-10-31 09:45 UTC);
# pnpm 12.17.0 refuses them otherwise. Entries age out of need after a day.
minimumReleaseAgeExclude:
  - '@pnpm/exe.android-arm64@12.17.0'
  - '@pnpm/exe.android-x64@12.17.0'
  - '@pnpm/exe.darwin-arm64@12.17.0'
  - '@pnpm/exe.darwin-x64@12.17.0'
  - '@pnpm/exe.freebsd-x64@12.17.0'
  - '@pnpm/exe.linux-arm64-musl@12.17.0'
  - '@pnpm/exe.linux-arm64@12.17.0'
  - '@pnpm/exe.linux-ppc64@12.17.0'
  - '@pnpm/exe.linux-riscv64@12.17.0'
  - '@pnpm/exe.linux-s390x@12.17.0'
  - '@pnpm/exe.linux-x64-musl@12.17.0'
  - '@pnpm/exe.linux-x64@12.17.0'
  - '@pnpm/exe.win32-arm64@12.17.0'
  - '@pnpm/exe.win32-x64@12.17.0'
  - pnpm@12.17.0
  - '@playwright/test@1.65.0-alpha-2026-10-31'
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261031.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261031.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261031.1'
  - playwright-core@1.65.0-alpha-2026-10-31
  - playwright@1.65.0-alpha-2026-10-31
  - react-dom@0.0.0-experimental-e84e1492-20261031
  - react@0.0.0-experimental-e84e1492-20261031
  - scheduler@0.0.0-experimental-e84e1492-20261031
