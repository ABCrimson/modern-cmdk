version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # A dependency that matches more than one group joins the first one listed, so the four
    # specific groups come before the two catch-all groups.
    groups:
      typescript:
        patterns: ['typescript']
        update-types: [minor, patch]
      biome:
        patterns: ['@biomejs/*']
        update-types: [minor, patch]
      playwright:
        patterns: ['@playwright/*', 'playwright', 'playwright-core']
        update-types: [minor, patch]
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # react, react-dom and scheduler are pinned to a 0.0.0-experimental-* build (pnpm-workspace.yaml
      # overrides), which the peak-modern sweep re-resolves at every session start. Dependabot cannot
      # order 0.0.0-experimental-* builds: PR #48 (2026-11-02) proposed 0.14.10, a 2020 release that
      # it sorts above them. Ignored for every update type.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'scheduler'
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
    commit-message:
      prefix: "ci(deps):"

  - package-ecosystem: cargo
    directory: /packages/command-search-wasm/crate
    schedule:
      interval: monthly
    labels:
      - dependencies
      - wasm
    commit-message:
      prefix: "chore(deps):"
