[package]
name = "command-search-wasm"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["Crimson Dev"]
description = "WASM-accelerated fuzzy search engine for modern-cmdk"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgen 0.2.127 emits bulk-memory / reference-types / sign-ext instructions;
# enable those features so wasm-opt validates and optimizes the modern output.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O4",
  "--enable-bulk-memory",
  "--enable-reference-types",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
  "--enable-multivalue",
]

[dependencies]
wasm-bindgen = "0.2.127"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
