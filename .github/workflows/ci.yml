name: CI
on:
  push:
    # release/** so a release branch is checked on every push, before its pull request is opened
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

# A main push's run is what release.yml's ci-gate waits on, so each push gets its own group
# and is never cancelled; only a newer push to the same pull request cancels that PR's earlier run.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Job graph: lint gates build, test, react-lanes, coverage, rust-wasm and docs; claims, links and security have no `needs:`
# and start beside lint. build runs once (after lint) and shares packages/*/dist as the `dist`
# artifact with dist-tests, e2e, bench, browser-bench, size, package and consumers, which need build; package also
# uploads the packed tarballs, which node24-install and templates (both need package) install. summary needs all 19 jobs.
# test, react-lanes, coverage, rust-wasm and docs do not
# need that build: the unit suites resolve `modern-cmdk` to src through the aliases in
# vitest.config.ts, and rust-wasm and docs build what they need themselves. Every job that installs
# from the committed lockfile uses `--frozen-lockfile`; the pnpm store cache (`cache: pnpm`) is keyed on the OS,
# architecture and lockfile hash alone, so the jobs that install packages no lockfile vets (react-lanes, package, consumers and templates) must not use it.
jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Zero warnings: the `lint` script is `biome check . --error-on-warnings`
      - run: pnpm lint
      # modern-cmdk, create-modern-cmdk, tests/, tests/e2e, tests/docs and the docs app (vue-tsc): none needs build output.
      # The projects that import built packages are checked after the build: tests/dist and the docs samples (dist-tests),
      # benchmarks (bench), the playground (e2e) and the wasm package (rust-wasm).
      - run: pnpm typecheck

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Topological order (a package builds after the workspace packages it depends on), no --parallel.
      # command-search-wasm skips its JS build here: it needs pkg/, which only the rust-wasm job produces.
      - run: pnpm --filter './packages/*' run build
      # The dist travels as one tar so file modes survive: upload-artifact does not keep them (its README, "Permission Loss",
      # read 2026-11-05: "File permissions are not maintained during zipped artifact upload. All directories will have `755`
      # and all files will have `644`."), and tsdown grants dist/codemod/bin.mjs its execute bit at build time. The archive
      # stores paths relative to the repo root; each job extracts it from the repo root, after the download.
      - name: Archive the dist
        run: tar -cf "$RUNNER_TEMP/dist.tar" packages/*/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist.tar
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Newest GA images. The macOS 27 image (`xcode-27`, public preview, no SLA) runs in
        # lanes.yml, not here.
        os: [ubuntu-26.04, macos-26, windows-2025-vs2026]
        # 26.4.0 = the engines.node floor; the other entry = .nvmrc
        # (a matrix cannot read the file — keep in sync).
        node: ['26.4.0', '28.0.0-nightly20261107a43bfb5bb2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # No build: the unit suites resolve src through the aliases; tests/dist runs in dist-tests.
      - run: pnpm exec vitest run --exclude "tests/dist/**"

  # Required (roadmap D15): the stable React release and the declared peer floor. scripts/lane.mjs
  # rewrites the pnpm overrides and runs `pnpm install --no-frozen-lockfile` with the release-age
  # policy lifted for that one install, so these installs are unvetted: no `cache: pnpm`, because the
  # setup-node cache key (OS, architecture, committed lockfile hash) ignores how the install ran, and this
  # job could otherwise write the store entry that the frozen-lockfile jobs restore.
  react-lanes:
    name: React ${{ matrix.lane }}
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [react-stable, react-floor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/lane.mjs ${{ matrix.lane }}
      - run: pnpm --filter modern-cmdk exec tsc --noEmit
      - run: pnpm exec vitest run --exclude "tests/dist/**"

  dist-tests:
    name: Built-package tests
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}
      - name: Extract the dist
        run: tar -xf "$RUNNER_TEMP/dist.tar"
      - run: pnpm exec tsc -p tests/dist/tsconfig.json --noEmit
      # Docs-samples gate (TEB-84): every fenced ts/tsx sample of apps/docs and the READMEs type-checks against the downloaded dist.
      # The dist artifact (the build job's packages/*/dist, as a tar) has no wasm build, so the wasm-importing samples are skipped here and checked in the Rust & WASM job.
      - run: pnpm check:doc-samples --skip-wasm
      # Snippet gate (CV-43, RP-13): every VS Code snippet of packages/vscode-modern-cmdk, expanded with its defaults, type-checks
      # against the downloaded dist (scripts/check-snippets.ts); the unit test covers only fixture packages.
      - run: pnpm check:snippets
      # tests/dist runs against the built packages: the CLI smoke test and the CLI execFile suite (the three built bins on fixture copies, byte for byte), the create-modern-cmdk tarball and the version its bin writes, the devtools and dialog subpaths, the exports map, the manifest, the one-core invariant and the shipped third-party notices
      - run: pnpm exec vitest run tests/dist

  coverage:
    name: Coverage
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet reads coverage-thresholds.json from origin/main, so full history and remote refs
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Thresholds come from coverage-thresholds.json (vitest.config.ts); a metric below its threshold fails the run
      - run: pnpm exec vitest run --coverage --exclude "tests/dist/**"
      # Fails when a threshold in coverage-thresholds.json is lower than the one on origin/main
      - run: node scripts/coverage-ratchet.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  rust-wasm:
    name: Rust & WASM
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack@0.15.1,cargo-deny@0.20.2,cargo-audit@0.22.2
      # With no argument, `rustup toolchain install` installs the toolchain that crate/rust-toolchain.toml
      # pins (channel, wasm32 target, rustfmt, clippy).
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
        working-directory: packages/command-search-wasm/crate
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/command-search-wasm/crate
      # wasm-pack uses a wasm-opt found on PATH and otherwise downloads its bundled Binaryen (version_130) from GitHub
      # releases in the middle of build:wasm, where a GitHub 504 failed the job (run 41998415732). So wasm-opt comes
      # from the newest Binaryen release (version_133; re-resolve with: gh release list -R WebAssembly/binaryen -L 1),
      # cached by version; only a cache miss downloads, with curl retries, and the tarball's sha256 is pinned below
      # (from the release's .sha256 asset). Bump the version, the sha and the cache key together.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: binaryen-cache
        with:
          path: ${{ runner.temp }}/binaryen
          key: binaryen-version_133-x86_64-linux
      - name: Download Binaryen on a cache miss
        if: steps.binaryen-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors \
            --output "$tarball" \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $tarball" | sha256sum --check
          mkdir "$RUNNER_TEMP/binaryen"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/binaryen" --strip-components=1
      - name: Put wasm-opt on PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen/bin/wasm-opt" --version
      - name: Format, lint and test the crate
        working-directory: packages/command-search-wasm/crate
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          cargo test --locked
      # deny.toml and Cargo.lock live in the crate directory. Both tools fetch the RustSec advisory
      # database over HTTPS with their built-in gitoxide client (cargo-deny's git-fetch-with-cli is
      # left at its default, false), so the step needs network access but no git CLI.
      - name: Check licenses, bans and advisories
        working-directory: packages/command-search-wasm/crate
        run: |
          cargo deny check
          cargo audit
      # The wasm package imports modern-cmdk, so that builds first; then the wasm-pack output
      # (pkg/), the package's tests against it (pkg-stub.test.ts, the src/pkg.d.ts drift guard, and wasm-engine.real.test.ts skip
      # themselves without pkg/, so this is the one CI run where they execute), the package's own typecheck
      # against the real pkg/ types, and its tsdown build.
      - run: pnpm --filter modern-cmdk run build
      - run: pnpm --filter modern-cmdk-search-wasm run build:wasm
      # MODERN_CMDK_REQUIRE_WASM_PKG=1 turns the skip of wasm-engine.real.test.ts (CE-116, the engine against the real pkg/) into a failure
      - run: pnpm exec vitest run packages/command-search-wasm
        env:
          MODERN_CMDK_REQUIRE_WASM_PKG: "1"
      - run: pnpm --filter modern-cmdk-search-wasm exec tsc --noEmit
      - run: pnpm --filter modern-cmdk-search-wasm run build
      # Docs-samples gate (TEB-84), the one run with both dists present: the wasm-importing samples type-check here (the modern-cmdk dist is built earlier in this job)
      - run: pnpm check:doc-samples

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}
      - name: Extract the dist
        run: tar -xf "$RUNNER_TEMP/dist.tar"
      # The playground imports the built modern-cmdk, so it is checked and built here, after the download
      - run: pnpm --filter playground exec tsc --noEmit
      - run: pnpm --filter playground run build
      # Chromium only: Firefox and WebKit are opt-in (E2E_ENGINES=all) until 1.8.0, never set in CI
      # The retry is for the apt mirror flake (run 42023125730: apt exit 100 'Unable to locate package'); an
      # infrastructure install retry announced with ::warning, never a test retry (LD-04 stands for tests).
      - name: Install Chromium (bounded retry on the apt mirror)
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm playwright install --with-deps chromium && exit 0
            if [ "$i" -eq 3 ]; then
              echo "::error::playwright install failed 3 times (apt mirror or registry)"
              exit 1
            fi
            echo "::warning::playwright install attempt $i failed (apt mirror or registry); retrying in 15 s"
            if ! sudo apt-get update; then echo "::warning::apt-get update failed before attempt $((i + 1))"; fi
            sleep 15
          done
      - run: pnpm playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  # Runs on pull requests as well as pushes (docs.yml deploys only from main), and is part of the CI
  # Summary, so a Mermaid, base-path or internal-link regression cannot merge.
  docs:
    name: Docs build & render
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm docs:build
      - name: Install Chromium (bounded retry on the apt mirror)
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm playwright install --with-deps chromium && exit 0
            if [ "$i" -eq 3 ]; then
              echo "::error::playwright install failed 3 times (apt mirror or registry)"
              exit 1
            fi
            echo "::warning::playwright install attempt $i failed (apt mirror or registry); retrying in 15 s"
            if ! sudo apt-get update; then echo "::warning::apt-get update failed before attempt $((i + 1))"; fi
            sleep 15
          done
      # Renders every built page under the Pages base (playwright.docs.config.ts)
      - run: pnpm test:docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docs-render
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  # Required: phantom claims (scripts/check-claims.mjs: APIs and numbers the code does not back) in
  # the README files, ARCHITECTURE.md, CONTRIBUTING.md, SECURITY.md and apps/docs, plus every page of
  # the GitHub wiki, cloned shallow into ./wiki for the scan (the wiki is a stub pointing at the docs
  # site since 2026-11-04; DECISIONS D9, D42). The script reads the checked-out files with git grep,
  # so it needs Node and nothing installed.
  claims:
    name: Phantom claims
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The wiki is a stub pointing at the docs site (DECISIONS D9, G-18); its clone is scanned read-only (D42).
      - name: Clone the wiki
        run: git clone --depth 1 https://github.com/ABCrimson/modern-cmdk.wiki.git wiki
      - run: node scripts/check-claims.mjs --wiki wiki

  # Required: external links and their #anchors in the Markdown the repository ships (lychee.toml
  # holds the retry policy and the reasoned excludes; the exclusion of the repository's own github.com
  # pages sits in the args below). Links between docs pages are checked against
  # the built site by tests/docs/links.spec.ts in the docs job.
  links:
    name: Links
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: scripts/check-repo-links.ts resolves blob/<abbreviated hash>/ links with git, and a shallow clone lacks those commits
          fetch-depth: 0
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          # Authenticated GitHub API calls: unauthenticated link checks are rate-limited
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          lycheeVersion: v0.24.2
          fail: true
          # The repository's own github.com pages are excluded here (lychee 0.24.2 chains CLI --exclude onto lychee.toml's
          # exclude list; it does not replace it): a GitHub 5xx on them failed this job in run 41998415732 even with
          # lychee.toml's max_retries = 6. The job's last step, node scripts/check-repo-links.ts (after setup-node), checks the blob/, tree/ and raw/ paths into
          # this repository (and the #readme, #L<n> and heading-anchor fragments on them) against the checkout; the routes GitHub serves from
          # repository state (the bare repository URL, /actions, /commit, /discussions, /issues, /pull, /releases, /security) stay unchecked.
          args: >-
            --config lychee.toml --no-progress
            --exclude '^https://github\.com/ABCrimson/modern-cmdk(\.git)?([/#?]|$)'
            README.md 'packages/*/README.md' CONTRIBUTING.md SECURITY.md ARCHITECTURE.md 'apps/docs/**/*.md'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-repo-links.ts

  size:
    name: Bundle Size
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}
      - name: Extract the dist
        run: tar -xf "$RUNNER_TEMP/dist.tar"
      - id: size
        run: |
          pnpm size-limit --json > size-report.json
          {
            echo "report<<EOF"
            cat size-report.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-report
          path: size-report.json
          retention-days: 30

  security:
    name: Security Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=high

  bench:
    name: Benchmarks
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}
      - name: Extract the dist
        run: tar -xf "$RUNNER_TEMP/dist.tar"
      - name: Compare against baseline
        # benchmarks/baseline.json keeps one record per CPU model (D97): the pool hands out several
        # models, and the thresholds judge a run only against the record of its own CPU. A run on a CPU
        # without a record prints the comparison informationally and exits 0.
        # compare-baseline.ts exits 1 for a regression above 5% (a warning by the documented
        # contract) and 2 for a regression above 15%, a median above its target_ms or a harness error.
        # Exit 2 fails the job only when a second run also exits 2 (two consecutive fails): a single run
        # of a shared runner and a Node nightly is noisy (CI run 42452131225, measured 2026-11-08: +16.1% and
        # +19.0% with no reproducible code change; an A/B on a local host gave -2.4% / -3.8%). After a first
        # exit 2 the step re-runs once: a passing re-run leaves a warning annotation, so a flaky pass stays
        # visible, and a second exit 2 leaves an error annotation. A baseline median
        # below floor_ms (0.01 ms; today only stateUpdate:navigate, 0.902 microseconds) is reported, not
        # compared, because runner noise at that scale exceeds 5%/15%.
        # `|| code=$?` is not a mask: it records the status of the deciding run, so exit 1 can become a
        # warning and exit 2 can trigger the one re-run; every other non-zero status is re-raised by
        # `exit "$code"`.
        # Time: one run took 16 s on a local host at RUNS 5 (2026-11-08); the CI runner is slower but two runs
        # stay well inside the 10-minute job.
        run: |
          code=0
          pnpm bench:compare || code=$?
          if [ "$code" -eq 2 ]; then
            first=$code
            code=0
            pnpm bench:compare || code=$?
            if [ "$code" -eq 2 ]; then
              echo "::error title=Benchmark comparison failed twice::The re-run of pnpm bench:compare also exited 2; the job fails."
            else
              echo "::warning title=Benchmark comparison failed once::The first pnpm bench:compare exited $first; the re-run exited $code, so the job does not fail on the first. See both comparison tables in this step."
            fi
          fi
          if [ "$code" -eq 1 ]; then
            echo "::warning title=Benchmark regression above 5%::See the comparison table in this step; a regression above 15% or a median above its target fails the job (after one re-run); baselines below the 0.01 ms floor are reported, not compared."
            exit 0
          fi
          exit "$code"
      - run: pnpm bench --run
      # benchmarks/tsconfig.json resolves modern-cmdk to the downloaded dist declarations
      - run: pnpm exec tsc -p benchmarks/tsconfig.json --noEmit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 30

  # The 1.6.0 exit gate (ruling R5): "10K mount <= 50 ms on the CI image per the bench" (roadmap
  # docs/plans/2026-10-31-roadmap-1.3-to-2.0.md:276), met by this job's own first run: 10K mount median
  # 47.80 ms (run 42455685144, 2026-11-08). The job's threshold is a regression tripwire (D94), 75 ms =
  # 1.5x that median rounded up to 5 ms, re-measured at the RC and never raised silently.
  # benchmarks/browser/run.ts builds the playground
  # (react-dom/profiling so <Profiler> timings exist) into a temp directory, serves it with vite preview,
  # drives its /bench route in Chromium at 1K and 10K items (1 warm-up + 7 measured runs each) and exits
  # 0 when the 10K mount median is at or below 75 ms, 1 when it is above, 2 on a harness error. Any
  # non-zero exit fails the job: the threshold is absolute (no relative comparison before CodSpeed at
  # 1.9, D20), not a warning and never masked. The harness writes its results JSON outside the checkout
  # (--out), so the committed results files cannot stand in for this run: when the harness dies before
  # writing, the upload finds nothing and fails. The JSON is uploaded whatever the verdict.
  browser-bench:
    name: Browser bench (Chromium, 10K mount gate)
    needs: build
    runs-on: ubuntu-26.04
    # A hang bound, not a mask. On CI run 42455685144 (2026-11-08) the harness step ran from 06:41:51Z to
    # 06:42:12Z, about 21 s (total_wall_ms 19310 in its results file): 8 runs at 10K of 1764 to 1974 ms
    # wall each and 8 at 1K of 493 to 592 ms, and the whole job 62 s. The harness fails each wait on its
    # own bound, but the worst case of those bounds added up is far past any sane limit, so the harness
    # carries an overall deadline (HARNESS_DEADLINE_MS, 15 minutes) that fails it loudly (exit 2, naming
    # where it was) first. This timeout is that deadline plus 10 minutes of checkout, install, dist
    # download and Chromium install with its bounded retry; the derivation holds, so the value stays 25.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}
      - name: Extract the dist
        run: tar -xf "$RUNNER_TEMP/dist.tar"
      # Chromium only (ruling R9). The retry is for the apt mirror flake (run 42023125730: apt exit 100
      # 'Unable to locate package'); an infrastructure install retry announced with ::warning, never a
      # test retry (LD-04 stands for tests): the harness below runs once.
      - name: Install Chromium (bounded retry on the apt mirror)
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm playwright install --with-deps chromium && exit 0
            if [ "$i" -eq 3 ]; then
              echo "::error::playwright install failed 3 times (apt mirror or registry)"
              exit 1
            fi
            echo "::warning::playwright install attempt $i failed (apt mirror or registry); retrying in 15 s"
            if ! sudo apt-get update; then echo "::warning::apt-get update failed before attempt $((i + 1))"; fi
            sleep 15
          done
      - run: node benchmarks/browser/run.ts --out "$RUNNER_TEMP/browser-bench/results.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-bench-results
          path: ${{ runner.temp }}/browser-bench/
          if-no-files-found: error
          retention-days: 30

  # Required through CI Summary (roadmap 1.4.0 exit gates). Packs the three packages (modern-cmdk,
  # create-modern-cmdk, modern-cmdk-codemod) from the downloaded dist (`pnpm pack` never builds), then
  # scripts/check-package.ts runs publint (strict) on all three tarballs, attw (esm-only) on modern-cmdk, the
  # committed file lists of modern-cmdk and modern-cmdk-codemod, the `use client` check on every react chunk,
  # no catalog: or workspace: left in a packed manifest, the bare-import allow-list and the bin shebangs and
  # execute bits; scripts/codemod-tarball-smoke.ts npm-installs the packed tarballs with their dependencies into
  # a temp dir (so it needs the npm registry) and runs the codemod; scripts/third-party-notices.ts --check
  # compares THIRD-PARTY-NOTICES.md with what the extracted dist/codemod generates; scripts/check-licenses.ts
  # audits the lockfile licence census against its policy. The SBOM is syft's SPDX JSON over the unpacked
  # tarballs, with javascript-package-cataloger added (syft's directory defaults leave it out, and a scan of
  # the .tgz files themselves lists no package), so it records every pack/*.tgz at its packed version. The
  # tarballs are kept as an artifact for the node24-install and templates jobs.
  package:
    name: Package integrity
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No `cache: pnpm`: scripts/codemod-tarball-smoke.ts npm-installs and runs a tree no lockfile vets.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}
      - name: Extract the dist
        run: tar -xf "$RUNNER_TEMP/dist.tar"
      - run: pnpm check:package --pack-dir "$RUNNER_TEMP/pack"
      # Codemod tarball smoke (W4-03): installs the packed tarballs with their dependencies from the npm registry
      # (no lockfile) with --min-release-age set to the root minimumReleaseAge in days (SEC-64) and runs the codemod; it prints the resolved tree. Measured 8.5 s on the author's host with a warm npm cache; a cold runner takes longer.
      # No retry: a registry failure fails the job.
      - run: node scripts/codemod-tarball-smoke.ts --pack-dir "$RUNNER_TEMP/pack"
      # modern-cmdk ships THIRD-PARTY-NOTICES.md; this fails when it is stale against the dist/codemod extracted above.
      - run: node scripts/third-party-notices.ts --check
      - run: pnpm check:licenses
      - name: Unpack the tarballs for the SBOM scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/sbom" "$RUNNER_TEMP/sbom-src"
          for tarball in "$RUNNER_TEMP"/pack/*.tgz; do
            name="$(basename "$tarball" .tgz)"
            mkdir "$RUNNER_TEMP/sbom-src/$name"
            tar -xzf "$tarball" -C "$RUNNER_TEMP/sbom-src/$name"
          done
          printf 'select-catalogers:\n  - "+javascript-package-cataloger"\n' > "$RUNNER_TEMP/syft.yaml"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom-src
          format: spdx-json
          config: ${{ runner.temp }}/syft.yaml
          output-file: ${{ runner.temp }}/sbom/sbom.spdx.json
          upload-artifact: 'false'
          upload-release-assets: 'false'
          # syft itself, newest release (sbom-action v0.24.3 defaults to v1.54.0). Re-resolve with: gh release list -R anchore/syft -L 1
          syft-version: v1.57.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 30

  # Required through CI Summary: scripts/consumer-smoke.ts packs modern-cmdk from the downloaded dist, copies the
  # consumer app from tests/consumers into a temp dir (the Next canary pinned in tests/consumers/next-app for both
  # Next variants, Vite for the third), installs the tarball, builds, serves, and checks the package.json export,
  # the core copy count, server rendering, the dialog subpath and the hydration count in Chromium. The report is
  # uploaded whenever the script wrote one; a failure before the first variant (such as a missing dist) writes none,
  # and the upload step then fails too.
  consumers:
    name: Consumer app (${{ matrix.variant }})
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [next-turbopack, next-webpack, vite]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No `cache: pnpm`: consumer-smoke.ts installs each app without a lockfile (see the header of scripts/consumer-smoke.ts).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}
      - name: Extract the dist
        run: tar -xf "$RUNNER_TEMP/dist.tar"
      - name: Install Chromium (bounded retry on the apt mirror)
        shell: bash
        run: |
          for i in 1 2 3; do
            pnpm playwright install --with-deps chromium && exit 0
            if [ "$i" -eq 3 ]; then
              echo "::error::playwright install failed 3 times (apt mirror or registry)"
              exit 1
            fi
            echo "::warning::playwright install attempt $i failed (apt mirror or registry); retrying in 15 s"
            if ! sudo apt-get update; then echo "::warning::apt-get update failed before attempt $((i + 1))"; fi
            sleep 15
          done
      # Through `pnpm run`, never bare node: the script spawns pnpm by the entry npm_execpath names and exits 2
      # outside pnpm (SEC-70, SEC-72).
      - run: pnpm run test:consumers --app ${{ matrix.variant }} --report consumers-${{ matrix.variant }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: consumers-${{ matrix.variant }}
          path: consumers-${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 14

  # Required through CI Summary: the packed modern-cmdk tarball, alone, installs under `npm --engine-strict`
  # on the newest Node 24. It needs `package` (not build) because it installs the tarball that job packed.
  # modern-cmdk's required peer is radix-ui (>=1.4.0 <2.0.0, DECISIONS D55); react and react-dom are optional
  # peers; idb-keyval is its only dependency. npm 7+ installs the required peer on its own and, through it,
  # radix-ui's react and react-dom peers (the newest stable 19.x), and skips the optional ones: the install
  # lets it, and `npm ls --depth=1` writes modern-cmdk's resolved dependency and peers into the log. Never add the root's experimental
  # react or the rc radix-ui pins here: they fall outside modern-cmdk's peer ranges and npm stops with
  # ERESOLVE before it reaches the engines check (the 1.2.3 verifier run).
  node24-install:
    name: Node 24 install (engine-strict)
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The newest 24.x on 2026-11-04. Re-resolve with:
          #   node -e "fetch('https://nodejs.org/dist/index.json').then(r=>r.json()).then(j=>console.log(j.find(x=>x.version.startsWith('v24.')).version))"
          node-version: '24.22.2'
      - name: Install the tarball alone under --engine-strict
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/n24"
          mkdir "$dir"
          cd "$dir"
          npm init -y
          tarballs=("$RUNNER_TEMP"/pack/modern-cmdk-[0-9]*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] && [ -f "${tarballs[0]}" ] || { echo "::error::expected exactly one modern-cmdk tarball, found: ${tarballs[*]}"; exit 1; }
          node --version | tee -a install.log
          npm install --engine-strict --no-audit --no-fund "${tarballs[0]}" 2>&1 | tee -a install.log
          npm ls --depth=1 2>&1 | tee -a install.log
          if grep -q EBADENGINE install.log; then
            echo "::error::npm reported EBADENGINE under Node 24"
            exit 1
          fi
          node -e "console.log(require.resolve('modern-cmdk/package.json'))"

  # Required through CI Summary: scripts/template-smoke.ts scaffolds react-basic, react-dialog and react-full from the
  # packed create-modern-cmdk tarball, installs each against the packed modern-cmdk, type-checks and builds it, so a
  # template that no longer installs, compiles or builds fails here (RP-36, CV-07, CV-39). It needs `package` (not
  # build) because it consumes the tarballs that job packed, and it needs no dist. Like react-lanes it installs
  # third-party pins that no lockfile vets (each template's own dependency set, the react pins), so setup-node takes
  # no pnpm store cache. timeout-minutes: the whole job (checkout, install, the tarball download and the smoke of all
  # three templates) took 28 s in run 42013071098 and 25 s in run 42014300173 on cold ubuntu-26.04 runners
  # (2026-11-05); 10 minutes guards a hang, the budget the other install-and-run jobs use, and the script logs the
  # seconds of every step, so a slower run says where the time went.
  templates:
    name: Templates (scaffold, tsc, build)
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/pack
      # Through `pnpm run`, never bare node: the script spawns pnpm by the entry npm_execpath names and exits 2
      # outside pnpm (SEC-70, SEC-72).
      - run: pnpm run test:templates --pack-dir "$RUNNER_TEMP/pack" --template all

  summary:
    name: CI Summary
    needs: [lint, build, test, react-lanes, dist-tests, coverage, rust-wasm, e2e, docs, claims, links, size, security, bench, browser-bench, package, consumers, node24-install, templates]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Generate summary
        run: |
          status_icon() {
            case "$1" in
              success) echo "pass" ;;
              failure) echo "FAIL" ;;
              cancelled) echo "skip" ;;
              skipped) echo "skip" ;;
              *) echo "warn" ;;
            esac
          }
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Status | Result |"
            echo "|-----|--------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          # job id | row label
          rows=(
            "lint|Lint & Typecheck"
            "build|Build (shared dist artifact)"
            "test|Tests (3 OS x 2 Node)"
            "react-lanes|React stable and peer floor"
            "dist-tests|Built-package tests"
            "coverage|Coverage and ratchet"
            "rust-wasm|Rust & WASM"
            "e2e|E2E (Chromium)"
            "docs|Docs build & render"
            "claims|Phantom claims"
            "links|Links"
            "size|Bundle Size"
            "security|Security Audit"
            "bench|Benchmarks"
            "browser-bench|Browser bench (Chromium, 10K mount gate)"
            "package|Package integrity"
            "consumers|Consumer apps"
            "node24-install|Node 24 install"
            "templates|Templates (scaffold, tsc, build)"
          )
          for row in "${rows[@]}"; do
            IFS='|' read -r id label <<< "$row"
            result=$(jq -r --arg id "$id" '.[$id].result' <<< "$NEEDS")
            echo "| $label | $(status_icon "$result") | \`$result\` |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Fail unless every job succeeded
        # Any result other than success (failure, cancelled, skipped) fails, for every job in `needs`.
        run: |
          if ! jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            jq -r 'to_entries[] | select(.value.result != "success") | "::error::\(.key): \(.value.result)"' <<< "$NEEDS"
            exit 1
          fi
