packages:
  - 'packages/*'
  - 'apps/*'
# Single source of the exact pins that two or more workspace manifests share: the six RDG-66 pins (react, react-dom,
# @types/react, @types/react-dom, typescript, vite; D54) and the five RDG-117 pins (@types/node, tsdown, jscodeshift,
# @types/jscodeshift, radix-ui; 1.5.0). Workspace manifests reference them as catalog:; the freshness sweep checks these
# entries at this site (dep-freshness-catalog.mjs, 2026-11-04). apps/docs keeps its own typescript pin (a scoped hold for
# vue-tsc) and the tests/consumers apps are not workspace projects. Peer ranges (modern-cmdk's radix-ui >=1.4.0 <2.0.0)
# and idb-keyval, a runtime dependency written out in its manifests, stay outside the catalog.
catalog:
  '@types/jscodeshift': 17.3.0
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  jscodeshift: 17.4.0
  radix-ui: 1.8.2-rc.1791984254107
  react: 0.0.0-experimental-4ae637b6-20261109
  react-dom: 0.0.0-experimental-4ae637b6-20261109
  tsdown: 0.23.7
  typescript: 7.1.0-dev.20261109.1
  vite: 8.3.7
overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
  # SEC-71 (Dependabot alert #41, GHSA-g3hv-75wg-m249, fixed in minimatch 11.0.1): @vscode/vsce 4.1.1-0, a devDependency of
  # packages/vscode-modern-cmdk (nothing published depends on it), declares minimatch ^10.2.6, which resolved to the vulnerable 10.2.6
  # (every @vscode/vsce build declares ^10.2.6). Pinned to the newest minimatch (11.0.5, published 2026-11-05T23:30Z, BlueOak-1.0.0). Drop this
  # override when a @vscode/vsce build declares minimatch 11.
  minimatch: 11.0.5
allowBuilds:
  esbuild: true
  lefthook: true
  # 2026-11-04: @vscode/vsce-sign (postinstall fetches a signing binary) arrives with @vscode/vsce; signing is publish-only and
  # `vsce package --no-dependencies` does not use it, so its build stays off (W2-03; .vsix listing proves packaging works).
  '@vscode/vsce-sign': false
# Agent skills (pnpm 12.19.0 `pnpm approve`): tsdown ships a skills/ directory and pnpm links an approved skill into
# .claude/skills/<name> on install (skills.dirs below), writing the managed .gitignore block there (committed). Approved by the owner on 2026-11-07 (G-43);
# nothing else awaits approval (`pnpm install` lists any new package).
permissions:
  tsdown:
    skills: true
# skills.dirs (pnpm 12.11.0+) names the directory the approved skills are linked into; unset, pnpm picks the directories that
# exist in the workspace root plus the one of the agent running it, so the link target would depend on who runs the install.
skills:
  dirs:
    - .claude/skills
# Supply-chain policy (pnpm 12.19.0). minimumReleaseAge is in minutes (1440 = 1 day, the built-in
# default, written out so the policy is visible). minimumReleaseAgeStrict: true fails resolution when
# no version in the requested range meets minimumReleaseAge instead of falling back to a younger one
# (pnpm.io/settings: it defaults to true only when minimumReleaseAge is set explicitly; written out
# here too). trustPolicy: no-downgrade fails the install for a version whose publish-trust evidence
# (provenance, trusted publisher) is weaker than an earlier release's.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# Exact versions published (per the npm registry, checked 2026-10-30) without provenance or a
# trusted publisher after an earlier release of the same package had one:
#   lefthook@2.2.2 - manual publish by a maintainer on 2026-10-13; 2.2.1 and 2.2.0 came from GitHub Actions
#   semver@5.7.2, semver@6.3.1 - 2023-07-10 backport patches; 7.5.4 (2023-07-07) had provenance.
#   pnpm-lock.yaml resolves semver@5.7.2 via jscodeshift > @babel/register > make-dir@2.1.0.
trustPolicyExclude:
  - lefthook@2.2.2
  - semver@5.7.2
  - semver@6.3.1
# Exact versions published less than minimumReleaseAge before the 2026-11-10 sweep install (pruned 2026-11-10 08:10 UTC: the canary.45,
# playwright 2026-11-08, typescript 20261108.1 and fake-indexeddb 6.2.8 entries); pnpm 12.19.0 refuses them otherwise. Entries age out of need after a day.
minimumReleaseAgeExclude:
  # pnpm@12.19.0 (next-12, published 2026-11-10T01:24:37Z) and its fourteen @pnpm/exe platform packages (00:50:31-01:24:34Z),
  # the lockfile's packageManagerDependencies, were under the 24 h minimumReleaseAge at the 2026-11-10 bump from 12.18.0. Drop after a day.
  - pnpm@12.19.0
  - '@pnpm/exe.android-arm64@12.19.0'
  - '@pnpm/exe.android-x64@12.19.0'
  - '@pnpm/exe.darwin-arm64@12.19.0'
  - '@pnpm/exe.darwin-x64@12.19.0'
  - '@pnpm/exe.freebsd-x64@12.19.0'
  - '@pnpm/exe.linux-arm64-musl@12.19.0'
  - '@pnpm/exe.linux-arm64@12.19.0'
  - '@pnpm/exe.linux-ppc64@12.19.0'
  - '@pnpm/exe.linux-riscv64@12.19.0'
  - '@pnpm/exe.linux-s390x@12.19.0'
  - '@pnpm/exe.linux-x64-musl@12.19.0'
  - '@pnpm/exe.linux-x64@12.19.0'
  - '@pnpm/exe.win32-arm64@12.19.0'
  - '@pnpm/exe.win32-x64@12.19.0'
  # next@16.5.0-canary.46 (the root devDependency for the docs-samples gate, TEB-84 and D57, and the tests/consumers/next-app pin) was
  # published 2026-11-09T23:57:45Z (its @next/env 23:49:53Z and platform binaries 23:50-23:55Z), under the 24 h minimumReleaseAge at the
  # 2026-11-10 bump from canary.45; with its @next/env and platform binaries. Drop after a day.
  - next@16.5.0-canary.46
  - '@next/env@16.5.0-canary.46'
  - '@next/swc-darwin-arm64@16.5.0-canary.46'
  - '@next/swc-darwin-x64@16.5.0-canary.46'
  - '@next/swc-linux-arm64-gnu@16.5.0-canary.46'
  - '@next/swc-linux-arm64-musl@16.5.0-canary.46'
  - '@next/swc-linux-x64-gnu@16.5.0-canary.46'
  - '@next/swc-linux-x64-musl@16.5.0-canary.46'
  - '@next/swc-win32-arm64-msvc@16.5.0-canary.46'
  - '@next/swc-win32-x64-msvc@16.5.0-canary.46'
  # @playwright/test, playwright and playwright-core 1.66.0-alpha-2026-11-10 (dist-tag next on all three; published 2026-11-10T05:21:20Z,
  # 05:19:10Z and 05:34:11Z) were under the 24 h minimumReleaseAge at the 2026-11-10 bump from 1.66.0-alpha-2026-11-08 (the lockfile
  # re-resolves playwright and playwright-core to the same build). Drop after a day.
  - '@playwright/test@1.66.0-alpha-2026-11-10'
  - playwright@1.66.0-alpha-2026-11-10
  - playwright-core@1.66.0-alpha-2026-11-10
  # typescript@7.1.0-dev.20261109.1 (next; published 2026-11-09T08:12:45Z) and its seven @typescript/typescript-<platform> binaries
  # (08:06-08:10Z) were under the 24 h minimumReleaseAge at the 2026-11-10 bump from the previous day's dev build. Drop after a day.
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261109.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261109.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261109.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261109.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261109.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261109.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261109.1'
  - typescript@7.1.0-dev.20261109.1
  # react, react-dom and scheduler 0.0.0-experimental-4ae637b6-20261109 (dist-tag experimental; published 2026-11-09T16:21:22Z, 16:21:04Z and
  # 16:21:25Z) and vite@8.3.7 (latest; 2026-11-09T10:25:29Z) were under the 24 h minimumReleaseAge at the 2026-11-10 bump. Drop after a day.
  - react@0.0.0-experimental-4ae637b6-20261109
  - react-dom@0.0.0-experimental-4ae637b6-20261109
  - scheduler@0.0.0-experimental-4ae637b6-20261109
  - vite@8.3.7
  # @testing-library/user-event@14.6.9 (latest; published 2026-11-10T03:48:18Z) was under the 24 h minimumReleaseAge at the 2026-11-10 bump from 14.6.8. Drop after a day.
