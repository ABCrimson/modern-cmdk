name: Release
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r --filter '!docs' --filter '!playground' --filter '!modern-cmdk-monorepo' --parallel run build

      # Publish via npm OIDC Trusted Publishing — no long-lived token.
      # An empty NPM_TOKEN / NODE_AUTH_TOKEN would make npm/pnpm try an empty
      # token and skip the OIDC fallback, so they are intentionally omitted
      # (changesets/action v2 no longer reads NPM_TOKEN or writes an .npmrc for it).
      # id-token: write (permissions, above) supplies the short-lived OIDC token.
      #
      # changesets/action v2 pushes release commits and tags through the GitHub API
      # with its default `github-token` (github.token); a GITHUB_TOKEN env var is
      # ignored. `push-git-tags` and `create-github-releases` default to true, so
      # per-package tags and GitHub releases are created after a publish.
      - name: Create Release PR or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset publish
          version-script: pnpm changeset version
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
