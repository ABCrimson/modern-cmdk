# Lefthook 2.2.2 — parallel execution, skip conditions, zero npm deps
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --staged --no-errors-on-unmatched {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx,vue}"
      # The same script CI's lint job runs: it needs no build output
      run: pnpm typecheck
      skip:
        - merge
        - rebase

# `piped` runs the jobs in order and stops at the first failure: the build comes first because
# tests/dist/* import packages/*/dist, and a stale dist failed tests/dist/devtools.test.tsx
# (ledger G-09). The group after it runs the tests and the size check in parallel on that one build.
pre-push:
  piped: true
  jobs:
    - name: build
      run: pnpm --filter './packages/*' run build
    - name: verify
      group:
        parallel: true
        jobs:
          - name: test
            run: pnpm exec vitest run --reporter=dot
          - name: size
            # Size runs when a push touches a package source file, a tsdown config or the root .size-limit.mjs or package.json (the budgets live
            # in .size-limit.mjs); a docs-only push skips it (the build above always runs). `packages/*/src/**`, not `src/**/*.{ts,tsx}`:
            # lefthook's glob needs a directory between `src/` and `**/`, so files directly under src (cli.ts, files.ts) never
            # matched and the pushes of 2b36297 and cdc05f2 skipped the check (CI run 41998415732 caught the budget; 2026-11-05).
            glob: "{packages/*/src/**,packages/*/tsdown.config.ts,.size-limit.mjs,package.json}"
            run: pnpm exec size-limit
