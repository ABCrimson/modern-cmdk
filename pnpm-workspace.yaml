packages:
  - 'packages/*'
  - 'apps/*'
# Single source of the six pins RDG-66 named (react, react-dom, @types/react, @types/react-dom, typescript, vite; D54).
# Workspace manifests reference them as catalog:; the freshness sweep checks these entries at this site
# (dep-freshness-catalog.mjs, 2026-11-04). apps/docs keeps its own typescript pin (a scoped hold for vue-tsc) and the
# tests/consumers apps are not workspace projects.
# Other exact pins shared by two manifests (@types/node, tsdown, jscodeshift, @types/jscodeshift, radix-ui, and idb-keyval,
# the runtime dependency RDG-117 leaves in its manifests) are still written in each manifest (RDG-117, 1.5.0).
catalog:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  react: 0.0.0-experimental-e84e1492-20261031
  react-dom: 0.0.0-experimental-e84e1492-20261031
  typescript: 7.1.0-dev.20261104.1
  vite: 8.3.5
overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
allowBuilds:
  esbuild: true
  lefthook: true
  # 2026-11-04: @vscode/vsce-sign (postinstall fetches a signing binary) arrives with @vscode/vsce; signing is publish-only and
  # `vsce package --no-dependencies` does not use it, so its build stays off (W2-03; .vsix listing proves packaging works).
  '@vscode/vsce-sign': false
# Supply-chain policy (pnpm 12.17.0). minimumReleaseAge is in minutes (1440 = 1 day, the built-in
# default, written out so the policy is visible). minimumReleaseAgeStrict: true fails resolution when
# no version in the requested range meets minimumReleaseAge instead of falling back to a younger one
# (pnpm.io/settings: it defaults to true only when minimumReleaseAge is set explicitly; written out
# here too). trustPolicy: no-downgrade fails the install for a version whose publish-trust evidence
# (provenance, trusted publisher) is weaker than an earlier release's.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# Exact versions published (per the npm registry, checked 2026-10-30) without provenance or a
# trusted publisher after an earlier release of the same package had one:
#   lefthook@2.2.2 - manual publish by a maintainer on 2026-10-13; 2.2.1 and 2.2.0 came from GitHub Actions
#   semver@5.7.2, semver@6.3.1 - 2023-07-10 backport patches; 7.5.4 (2023-07-07) had provenance.
#   pnpm-lock.yaml resolves semver@5.7.2 via jscodeshift > @babel/register > make-dir@2.1.0.
trustPolicyExclude:
  - lefthook@2.2.2
  - semver@5.7.2
  - semver@6.3.1
# Exact versions published less than minimumReleaseAge before the 2026-11-04 lockfile refreshes (pruned 2026-11-05 00:08 UTC);
# pnpm 12.17.0 refuses them otherwise. Entries age out of need after a day.
minimumReleaseAgeExclude:
  # @biomejs/biome@2.6.5 and its ten platform binaries were published 2026-11-04T12:46Z, a few hours before this install
  - '@biomejs/biome@2.6.5'
  - '@biomejs/cli-android-arm64@2.6.5'
  - '@biomejs/cli-android-x64@2.6.5'
  - '@biomejs/cli-darwin-arm64@2.6.5'
  - '@biomejs/cli-darwin-x64@2.6.5'
  - '@biomejs/cli-linux-arm64@2.6.5'
  - '@biomejs/cli-linux-arm64-musl@2.6.5'
  - '@biomejs/cli-linux-x64@2.6.5'
  - '@biomejs/cli-linux-x64-musl@2.6.5'
  - '@biomejs/cli-win32-arm64@2.6.5'
  - '@biomejs/cli-win32-x64@2.6.5'
  - '@playwright/test@1.66.0-alpha-2026-11-04'
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261104.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261104.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261104.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261104.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261104.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261104.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261104.1'
  - playwright-core@1.66.0-alpha-2026-11-04
  - playwright@1.66.0-alpha-2026-11-04
  - typescript@7.1.0-dev.20261104.1
  # next@16.5.0-canary.41 (the root devDependency for the docs-samples gate, TEB-84 and D57, and the tests/consumers/next-app pin) was
  # published 2026-11-04T23:52Z (its @next/env and platform binaries 23:41-23:44Z), under the 24 h minimumReleaseAge at the 2026-11-05
  # bump from canary.40; with its @next/env and platform binaries. Drop after a day.
  - next@16.5.0-canary.41
  - '@next/env@16.5.0-canary.41'
  - '@next/swc-darwin-arm64@16.5.0-canary.41'
  - '@next/swc-darwin-x64@16.5.0-canary.41'
  - '@next/swc-linux-arm64-gnu@16.5.0-canary.41'
  - '@next/swc-linux-arm64-musl@16.5.0-canary.41'
  - '@next/swc-linux-x64-gnu@16.5.0-canary.41'
  - '@next/swc-linux-x64-musl@16.5.0-canary.41'
  - '@next/swc-win32-arm64-msvc@16.5.0-canary.41'
  - '@next/swc-win32-x64-msvc@16.5.0-canary.41'
