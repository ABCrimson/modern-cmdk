name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: maintenance task; every task waits for CI on the dispatched commit
        type: choice
        required: true
        options: [backfill]

# A dispatched run gets its own group, so it can never replace a queued release run for a push.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Reset permissions; each job declares only what it needs.
permissions: {}

# Job graph. On a push to main: ci-gate -> select-mode -> version | pack -> attest -> publish.
# On a manual dispatch: ci-gate -> backfill. A job whose `needs` ancestor is skipped is
# skipped too, so a dispatch never reaches select-mode, version, pack, attest or publish and a push
# never reaches backfill.
#
# ci-gate holds every other job until the ci.yml run for the same commit has completed and
# succeeded: nothing is published or released for a commit whose CI is red or cancelled. It also
# fails while any issue labelled `lane-red` is open: lanes.yml opens one when a scheduled lane (React
# canary, TypeScript latest or rc, xcode-27, weekly audit) is red, so a red lane blocks the next
# release. To override, fix the lane and close the issue; there is no other switch.
# `workflow_run` was rejected because its GITHUB_SHA and GITHUB_REF are the default branch
# head, not the commit that CI checked. ci.yml starts in parallel with this workflow, so
# the gate polls until that run appears and finishes.
#
# changesets/action v2.1.2 split into sub-actions, following the trusted-publishing
# setup in its README and https://changesets.dev/guide/automating: select-mode decides
# whether to version or publish; version opens/updates the release PR; pack builds the
# tarballs without any write permission; attest makes an SPDX SBOM, a build-provenance attestation
# and an SBOM attestation for each packed tarball; publish needs attest, so a failed attestation stops
# the release before npm has the version, and uploads those same tarballs. publish and attest are the
# only jobs holding id-token: write; attest takes it for Sigstore with attestations: write and
# artifact-metadata: write, and holds no npm credential and no contents permission, while publish
# holds contents: write and the npm OIDC publish. publish runs in the `npm` environment, whose deployment
# branches are restricted to main.
#
# Publish via npm OIDC Trusted Publishing — no long-lived token. An empty NPM_TOKEN /
# NODE_AUTH_TOKEN would make npm/pnpm try an empty token and skip the OIDC fallback, so
# they are intentionally omitted. The version and publish sub-actions push commits and
# tags through the GitHub API with their default `github-token` (github.token); a
# GITHUB_TOKEN env var is ignored. publish's `push-git-tags` and
# `create-github-releases` default to true, so per-package tags and GitHub releases are
# created after a publish. backfill is meant to create the missing tags and releases for
# the two npm versions that were published without them (see the job for why it needs a
# token other than the GITHUB_TOKEN).
#
# Per the changesets guide, git credentials are not persisted on disk and no job here restores the
# pnpm cache (cache poisoning): setup-node keys it on the OS, architecture and lockfile hash alone,
# so any job that installs from the same lockfile could have written the entry a publishing job
# would restore. select-mode is included because it creates the publish plan that pack and publish consume.
jobs:
  ci-gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read # gh run list
      issues: read # gh issue list
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fail while a scheduled lane is red
        shell: bash
        run: |
          open=$(gh issue list --label lane-red --state open --json number --jq length)
          if [ "$open" -ne 0 ]; then
            echo "Open lane-red issues:"
            gh issue list --label lane-red --state open --json url --jq '.[].url'
            echo "::error::$open open lane-red issue(s) block the release. Fix the lane, then close the issue."
            exit 1
          fi
          echo "No open lane-red issue"
      - name: Wait for CI on this commit
        shell: bash
        run: |
          while true; do
            # Newest ci.yml push run for this commit as "<status> <conclusion|none> <url>"; empty until that run exists.
            if ! line=$(gh run list --commit "$GITHUB_SHA" --workflow ci.yml --event push \
                --json databaseId,status,conclusion,url --limit 10 \
                --jq 'sort_by(.databaseId) | if length == 0 then empty else last | "\(.status) \(if .conclusion == null or .conclusion == "" then "none" else .conclusion end) \(.url)" end'); then
              echo "gh run list failed; retrying"
              sleep 30
              continue
            fi
            if [ -z "$line" ]; then
              echo "No ci.yml run for $GITHUB_SHA yet"
            else
              read -r status conclusion url <<< "$line"
              echo "CI run $url: status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "::error::CI did not succeed for $GITHUB_SHA ($conclusion): $url"
                exit 1
              fi
            fi
            sleep 30
          done

  select-mode:
    if: github.event_name == 'push'
    needs: ci-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # commit version changes (changesets/action/version)
      pull-requests: write # create/update the release PR (changesets/action/version)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create or update the release PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The action runs `script` without a shell, so the two commands live in the `version-packages` package.json script.
          # `changeset version` rewrites workspace specifiers that pnpm-lock.yaml records, so that script refreshes the lockfile too.
          script: pnpm version-packages
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter './packages/*' run build
      - name: Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Supply chain: every tarball that pack produced gets an SPDX SBOM, a build-provenance attestation and
  # an SBOM attestation, over the exact bytes publish uploads (same artifact id, never re-packed).
  # publish needs this job, so an attestation failure stops the release before npm has the version.
  # Permissions follow the actions/attest README ("Ensure that the following permissions are set"):
  # id-token (Sigstore signing certificate), attestations (persist the attestation) and artifact-metadata
  # (artifact storage record). No contents, no checkout, no pnpm cache and no npm credential here.
  attest:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, pack]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore signing certificate (actions/attest)
      attestations: write # persist the attestations (actions/attest)
      artifact-metadata: write # artifact storage record (actions/attest)
    steps:
      - name: Download the packed tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: pack
      # Fails loudly unless the tarball set is exactly the publish plan, every tarball is one of the two
      # published packages and its sha256 equals the plan's integrity (the bytes publish will upload).
      # Each tarball is also unpacked under sbom-src/<package> for the SBOM scan. Syft's directory defaults leave out
      # javascript-package-cataloger (it reads package.json only for installed/image sources) and a tarball holds no
      # lockfile, so syft.yaml adds that cataloger; without it the SBOM lists no package.
      - name: Check the pack layout and unpack for the SBOM scan
        id: tarballs
        shell: bash
        run: |
          set -euo pipefail
          plan=pack/publish-plan.json
          [ -f "$plan" ] || { echo "::error::$plan is missing from the pack artifact"; exit 1; }
          mapfile -t releases < <(jq -r '.plan[][] | select(.kind == "publish") | [.name, .tarball.path, .tarball.integrity] | @tsv' "$plan")
          echo "count=${#releases[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#releases[@]}" -eq 0 ]; then
            echo "::notice::The publish plan holds no package to publish; nothing to attest"
            exit 0
          fi
          mapfile -t on_disk < <(cd pack && printf '%s\n' packages/*.tgz | sort)
          mapfile -t planned < <(printf '%s\n' "${releases[@]}" | cut -f2 | sort)
          if [ "${on_disk[*]}" != "${planned[*]}" ]; then
            echo "::error::Tarballs on disk (${on_disk[*]}) differ from the publish plan (${planned[*]})"
            exit 1
          fi
          mkdir sbom sbom-src
          printf 'select-catalogers:\n  - "+javascript-package-cataloger"\n' > syft.yaml
          for release in "${releases[@]}"; do
            IFS=$'\t' read -r name tarball integrity <<< "$release"
            case "$name" in
              modern-cmdk) key=modern_cmdk ;;
              create-modern-cmdk) key=create_modern_cmdk ;;
              *) echo "::error::No attestation steps for published package $name; add them to the attest job"; exit 1 ;;
            esac
            actual="sha256-$(openssl dgst -sha256 -binary "pack/$tarball" | base64)"
            if [ "$actual" != "$integrity" ]; then
              echo "::error::$tarball digest $actual differs from the plan's $integrity"
              exit 1
            fi
            mkdir "sbom-src/$key"
            tar -xzf "pack/$tarball" -C "sbom-src/$key"
            echo "$key=pack/$tarball" >> "$GITHUB_OUTPUT"
          done
      - name: SBOM for modern-cmdk
        if: steps.tarballs.outputs.modern_cmdk != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src/modern_cmdk
          format: spdx-json
          config: syft.yaml
          output-file: sbom/modern-cmdk.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          # syft itself, newest release (sbom-action v0.24.3 defaults to v1.54.0). Re-resolve with: gh release list -R anchore/syft -L 1
          syft-version: v1.56.0
      - name: SBOM for create-modern-cmdk
        if: steps.tarballs.outputs.create_modern_cmdk != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src/create_modern_cmdk
          format: spdx-json
          config: syft.yaml
          output-file: sbom/create-modern-cmdk.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          # syft itself, newest release (sbom-action v0.24.3 defaults to v1.54.0). Re-resolve with: gh release list -R anchore/syft -L 1
          syft-version: v1.56.0
      - name: Build provenance attestation
        if: steps.tarballs.outputs.count != '0'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: pack/packages/*.tgz
      # sbom-path takes one SBOM, so each tarball has its own SBOM attestation step.
      - name: SBOM attestation for modern-cmdk
        if: steps.tarballs.outputs.modern_cmdk != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.tarballs.outputs.modern_cmdk }}
          sbom-path: sbom/modern-cmdk.spdx.json
      - name: SBOM attestation for create-modern-cmdk
        if: steps.tarballs.outputs.create_modern_cmdk != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.tarballs.outputs.create_modern_cmdk }}
          sbom-path: sbom/create-modern-cmdk.spdx.json
      - name: Upload the SBOMs
        if: steps.tarballs.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom/*.spdx.json
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: [pack, attest]
    environment: npm
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # push tags and create GitHub releases (changesets/action/publish)
      id-token: write # npm trusted publishing (changesets/action/publish)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # No `script`: with a pack-dir artifact the sub-action runs `changeset publish
      # --from-pack-dir <dir>` itself (a custom script would bypass the packed tarballs).
      - name: Publish packages
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

  # Temporary: modern-cmdk@1.2.2 and create-modern-cmdk@1.2.1 reached npm (commit 33678255)
  # without a git tag or GitHub release. `gh release create` creates each tag through the API at
  # --target, so no tag is pushed by hand. That API call needs a token authorized to modify
  # workflows when the target commit's .github/workflows differs from the default branch's
  # (docs.github.com, "Create a release"); the GITHUB_TOKEN cannot be, and the workflows changed
  # after 33678255, so with the GITHUB_TOKEN below this job fails with HTTP 403 (run 41786088539).
  # It works only after GH_TOKEN is pointed at a token holding the Workflows permission.
  # Delete this job (and the `backfill` dispatch option) once the 1.4.0 gate
  # "gh release list equals npm" has passed.
  backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'backfill'
    needs: ci-gate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # create tags and GitHub releases (gh release create)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create the missing tags and releases
        shell: bash
        run: |
          set -euo pipefail
          sha=33678255dcee29a02a1222c10f5698f47cf7f24c
          # tag | package directory | CHANGELOG heading of that version
          entries=(
            "modern-cmdk@1.2.2|modern-cmdk|## 1.2.2"
            "create-modern-cmdk@1.2.1|create-modern-cmdk|## 1.2.1"
          )
          for entry in "${entries[@]}"; do
            IFS='|' read -r tag dir heading <<< "$entry"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::Release $tag already exists; skipping"
              continue
            fi
            notes=$(mktemp)
            # The CHANGELOG section under $heading, without the heading line and without surrounding blank lines.
            awk -v heading="$heading" '
              $0 == heading { on = 1; next }
              on && /^## / { exit }
              on && NF == 0 { blank++; next }
              on { if (started) while (blank-- > 0) print ""; blank = 0; started = 1; print }
            ' "packages/$dir/CHANGELOG.md" > "$notes"
            if [ ! -s "$notes" ]; then
              echo "::error::No '$heading' section in packages/$dir/CHANGELOG.md"
              exit 1
            fi
            gh release create "$tag" --target "$sha" --title "$tag" --notes-file "$notes" --latest=false --verify-tag=false
          done
